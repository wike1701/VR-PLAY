# Encargos de voz: Claude programa los issues con la etiqueta "claude-implementar".
#
# Los issues los crea el bot de voz (carpeta voz-a-claude, fuera de este repositorio) cada vez que
# alguien dice «Claude, ...» en el canal de voz de Discord. Al ponerle la etiqueta al issue, Claude
# lee CLAUDE.md, programa el encargo en una rama nueva y deja el enlace para abrir el Pull Request.
# Nunca toca main: hasta que no se acepta el Pull Request no se publica nada en la web.
#
# También responde si escribes "@claude ..." en un comentario de un issue o de un Pull Request
# (solo a los dueños y colaboradores del repositorio), para pedirle cambios sobre la marcha.
#
# Necesita la app de Claude instalada en el repositorio y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (la suscripción de Claude; o ANTHROPIC_API_KEY, ver la sección «Encargos de voz» del README).

name: Claude implementa encargos de voz

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude-implementar') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Node para las comprobaciones del proyecto (idiomas, calidad, marcadores, estructura)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          # Se usa la suscripción de Claude (secreto CLAUDE_CODE_OAUTH_TOKEN, de «claude setup-token»).
          # Para usar en su lugar una API key de pago por uso: secreto ANTHROPIC_API_KEY y cambiar las líneas.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude-implementar"
          claude_args: |
            --max-turns 60
