# Encargos de voz: Claude programa los issues con la etiqueta "claude-implementar" y los sube a main.
#
# Los issues los crea el bot de voz (carpeta voz-a-claude, fuera de este repositorio) cada vez que
# el usuario dice «Claude, ...» en el canal de voz de Discord, y el bot les pone ya la etiqueta.
# Claude lee CLAUDE.md y programa el encargo en una rama (claude/issue-N-...). Después, si hay
# cambios y pasan las comprobaciones del proyecto (sintaxis, idiomas, marcadores, estructura y
# calidad), se ponen encima de main y se suben: la web se publica sola. Si algo falla, no se sube
# nada, la rama se queda y se avisa en el issue.
#
# También responde si escribes "@claude ..." en un comentario de un issue o de un Pull Request
# (solo a los dueños y colaboradores del repositorio); esos cambios NO se suben solos a main.
#
# Necesita la app de Claude instalada en el repositorio y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (la suscripción de Claude; o ANTHROPIC_API_KEY, ver la sección «Encargos de voz» del README).

name: Claude implementa encargos de voz

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Un encargo detrás de otro: así dos encargos seguidos no se pisan al subir a main
concurrency:
  group: claude-encargos
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude-implementar') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node para las comprobaciones del proyecto (idiomas, calidad, marcadores, estructura)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          # Se usa la suscripción de Claude (secreto CLAUDE_CODE_OAUTH_TOKEN, de «claude setup-token»).
          # Para usar en su lugar una API key de pago por uso: secreto ANTHROPIC_API_KEY y cambiar las líneas.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude-implementar"
          claude_args: |
            --max-turns 60

      # ─── Subir a main ─────────────────────────────────────────────────────
      # Solo para los encargos (issues etiquetados). Busca la rama que ha hecho Claude para este
      # issue, la pone encima de main, pasa las comprobaciones y, si todo va bien, la sube a main,
      # borra la rama, lo cuenta en el issue y lo cierra.
      - name: Subir el encargo a main
        id: subir
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git fetch origin --prune
          RAMA=$(git for-each-ref --sort=-committerdate --format='%(refname:lstrip=3)' "refs/remotes/origin/claude/issue-${ISSUE}-*" | head -n 1)
          if [ -z "$RAMA" ] || [ -z "$(git rev-list "origin/main..origin/$RAMA")" ]; then
            echo "Claude no ha hecho cambios: no hay nada que subir."
            echo "nada=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rama=$RAMA" >> "$GITHUB_OUTPUT"
          git checkout -B subir "origin/$RAMA"
          git rebase origin/main
          # Comprobaciones del proyecto (las mismas que pide CLAUDE.md antes de subir)
          for f in $(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.js' '*.mjs'); do
            node --input-type=module --check < "$f"
          done
          node herramientas/idiomas.mjs
          node herramientas/marcadores.mjs
          node herramientas/estructura.mjs
          node herramientas/calidad.mjs
          git push origin HEAD:main
          git push origin --delete "$RAMA" || true
          COMMIT=$(git rev-parse --short HEAD)
          gh issue comment "$ISSUE" --body "✅ Subido a \`main\` ($COMMIT). La web se publica sola en unos minutos."
          gh issue close "$ISSUE"

      - name: Avisar si no se ha podido subir
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RAMA: ${{ steps.subir.outputs.rama }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ No se ha subido a \`main\`: ha fallado algo (las comprobaciones del proyecto o un conflicto con main). Los cambios siguen en la rama \`${RAMA:-sin rama}\`. Mira el registro en Actions."
