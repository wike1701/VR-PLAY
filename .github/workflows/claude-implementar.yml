# Encargos de voz: Claude programa los encargos y los sube a main.
#
# Los issues los crea el bot de voz (carpeta voz-a-claude, fuera de este repositorio) cada vez que
# el usuario dice «Claude, ...» en el canal de voz de Discord. Se lanza:
#   - al abrirse un issue de encargo de voz (empieza por «🎙️», lleva «@claude» y lo ha creado el
#     dueño del repositorio: el bot usa su token). El token del bot no puede poner etiquetas (haría
#     falta darle permiso sobre el código), así que el aviso va en el texto y la etiqueta «voz» la
#     pone este workflow;
#   - o al poner a mano la etiqueta «claude-implementar» en cualquier issue.
# Claude lee CLAUDE.md y programa el encargo en una rama (claude/issue-N-...). Después, si hay
# cambios y pasan las comprobaciones del proyecto (sintaxis, idiomas, marcadores, estructura y
# calidad), se ponen encima de main y se suben: la web se publica sola. Si algo falla, no se sube
# nada, la rama se queda y se avisa en el issue. Cada encargo va por su lado y, si dos suben a la vez,
# el segundo se pone encima del primero y lo reintenta.
#
# También responde si escribes "@claude ..." en un comentario de un issue o de un Pull Request
# (solo a los dueños y colaboradores del repositorio). Si el comentario es en un issue de encargo
# (etiqueta «voz» o «claude-implementar»), por ejemplo para reintentar uno que falló, los cambios
# también se suben solos a main; en los demás issues y en los Pull Request, no.
#
# Necesita la app de Claude instalada en el repositorio y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (la suscripción de Claude; o ANTHROPIC_API_KEY, ver la sección «Encargos de voz» del README).

name: Claude implementa encargos de voz

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-implementar') ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '🎙️') && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Cada encargo por su lado (GitHub solo deja uno en espera por grupo: con un grupo común, tres
    # encargos seguidos cancelarían el del medio). Si dos suben a la vez, ver los reintentos de abajo.
    concurrency:
      group: claude-encargo-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Los encargos de voz llevan la etiqueta «voz» (el token del bot no puede ponerla)
      - name: Etiquetar el encargo de voz
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label voz || true

      # Node para las comprobaciones del proyecto (idiomas, calidad, marcadores, estructura)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          # Se usa la suscripción de Claude (secreto CLAUDE_CODE_OAUTH_TOKEN, de «claude setup-token»).
          # Para usar en su lugar una API key de pago por uso: secreto ANTHROPIC_API_KEY y cambiar las líneas.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude-implementar"
          # Sin esta lista, Claude no puede ejecutar node ni ponerse al día con main: solo las
          # herramientas de comprobación del proyecto y los comandos de git para leer y hacer rebase
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(node herramientas/idiomas.mjs:*),Bash(node herramientas/marcadores.mjs:*),Bash(node herramientas/estructura.mjs:*),Bash(node herramientas/calidad.mjs:*),Bash(git fetch:*),Bash(git rebase:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      # ─── Subir a main ─────────────────────────────────────────────────────
      # Solo para los encargos: al abrir o etiquetar el issue, o con un «@claude» en un comentario
      # del propio issue (para reintentar). Busca la rama que ha hecho Claude para este
      # issue, la pone encima de main, pasa las comprobaciones y, si todo va bien, la sube a main,
      # borra la rama, lo cuenta en el issue y lo cierra.
      - name: Subir el encargo a main
        id: subir
        if: |
          github.event_name == 'issues' ||
          (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
           (contains(github.event.issue.labels.*.name, 'voz') || contains(github.event.issue.labels.*.name, 'claude-implementar')))
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          # La acción de Claude cambia las credenciales de git y al acabar las retira: se vuelve a
          # usar el permiso de este workflow (contents: write) para poder subir a main
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin --prune
          RAMA=$(git for-each-ref --sort=-committerdate --format='%(refname:lstrip=3)' "refs/remotes/origin/claude/issue-${ISSUE}-*" | head -n 1)
          if [ -z "$RAMA" ] || [ -z "$(git rev-list "origin/main..origin/$RAMA")" ]; then
            echo "Claude no ha hecho cambios: no hay nada que subir."
            echo "nada=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rama=$RAMA" >> "$GITHUB_OUTPUT"
          git checkout -B subir "origin/$RAMA"
          git rebase origin/main
          # Comprobaciones del proyecto (las mismas que pide CLAUDE.md antes de subir)
          for f in $(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.js' '*.mjs'); do
            node --input-type=module --check < "$f"
          done
          node herramientas/idiomas.mjs
          node herramientas/marcadores.mjs
          node herramientas/estructura.mjs
          node herramientas/calidad.mjs
          # Si otro encargo acaba de subir a main, se vuelve a poner encima y se reintenta
          for intento in 1 2 3 4 5; do
            if git push origin HEAD:main; then break; fi
            if [ "$intento" = 5 ]; then exit 1; fi
            sleep $((intento * 5))
            git fetch origin main
            git rebase origin/main
          done
          git push origin --delete "$RAMA" || true
          COMMIT=$(git rev-parse --short HEAD)
          gh issue comment "$ISSUE" --body "✅ Subido a \`main\` ($COMMIT). La web se publica sola en unos minutos."
          gh issue close "$ISSUE"

      - name: Avisar si no se ha podido subir
        if: failure() && steps.subir.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RAMA: ${{ steps.subir.outputs.rama }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ No se ha subido a \`main\`: ha fallado algo (las comprobaciones del proyecto o un conflicto con main). Los cambios siguen en la rama \`${RAMA:-sin rama}\`. Mira el registro en Actions. Para reintentarlo, escribe en este issue \`@claude reintenta: ponte al día con main\`: lo rehará y, si pasan las comprobaciones, lo subirá a main."
