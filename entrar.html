<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="cuenta.tituloEntrar">Entrar · VR Play</title>
<script src="idiomas/detectar.js"></script>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="theme-color" content="#0a0b10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="estilos/base.css">
<link rel="stylesheet" href="estilos/cuenta.css">
</head>
<body>

<header>
  <div class="contenedor cabecera">
    <a class="logo" href="index.html">VR<span>·</span>Play</a>
    <nav class="menu" data-i18n-attr="aria-label:comun.secciones" aria-label="Secciones">
      <a href="index.html" data-i18n="comun.juegos">Juegos</a>
      <span data-selector-idioma></span>
    </nav>
  </div>
</header>

<main class="contenedor" id="vista" aria-live="polite"></main>

<footer class="contenedor">
  <a href="legal.html#privacidad" data-i18n="comun.privacidad">Privacidad</a> · <a href="legal.html#aviso-legal" data-i18n="comun.avisoLegal">Aviso legal</a>
</footer>

<script type="module">
  // Entrar en la cuenta (ver servidor/cuenta.js):
  //   1. Con Google, o con el correo: llega un enlace (vuelve aquí con #acceso=…) y un código de 6 cifras
  //      para escribirlo aquí si el correo se lee en otro dispositivo (por ejemplo, en las gafas).
  //   2. La primera vez se elige el alias (con el año de nacimiento).
  //   3. Lo del navegador pasa a la cuenta y se vuelve a la página de antes (?volver=).
  import { t, idioma } from './idiomas/idiomas.js';
  import { apiCuenta, estadoCuenta, fusionarNavegador, olvidarCuenta, avatar } from './shell/cuenta.js';

  const $vista = document.getElementById('vista');
  const parametros = new URLSearchParams(location.search);
  const volver = /^\/(?!\/)/.test(parametros.get('volver') || '') ? parametros.get('volver') : 'index.html';

  function el(etiqueta, atributos = {}, ...hijos) {
    const nodo = document.createElement(etiqueta);
    for (const [clave, valor] of Object.entries(atributos)) {
      if (valor === false || valor === null || valor === undefined) continue;
      if (clave.startsWith('on')) nodo.addEventListener(clave.slice(2), valor);
      else if (clave === 'class') nodo.className = valor;
      else nodo.setAttribute(clave, valor === true ? '' : valor);
    }
    for (const hijo of hijos.flat()) {
      if (hijo === null || hijo === undefined || hijo === false) continue;
      nodo.append(hijo instanceof Node ? hijo : String(hijo));
    }
    return nodo;
  }
  const aviso = () => el('p', { class: 'aviso', role: 'status' });
  function avisar($aviso, mensaje, tipo = 'error') {
    $aviso.textContent = mensaje;
    $aviso.className = `aviso ${tipo}`;
  }
  // Botón que se desactiva mientras se espera al servidor
  async function esperando(boton, tarea) {
    boton.disabled = true;
    try { await tarea(); } finally { boton.disabled = false; }
  }

  const LOGO_GOOGLE = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';

  // ─── 1. Correo o Google ─────────────────────────────────────────────────
  function verCorreo(estado, mensaje = '') {
    const $aviso = aviso();
    if (mensaje) avisar($aviso, mensaje);
    const $formulario = el('form', { novalidate: true },
      el('label', {}, t('cuenta.tuCorreo'),
        el('input', { name: 'correo', type: 'email', required: true, autocomplete: 'email', inputmode: 'email', placeholder: t('cuenta.correoEjemplo') })),
      el('button', { class: 'boton ancho', type: 'submit' }, t('cuenta.enviarEnlace')),
      el('p', { class: 'ayuda' }, t('cuenta.sinContrasena')),
      $aviso,
    );
    $formulario.addEventListener('submit', (e) => {
      e.preventDefault();
      const correo = $formulario.correo.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return avisar($aviso, t('cuenta.errores.correo'));
      esperando($formulario.querySelector('button'), async () => {
        try {
          await apiCuenta('/enlace', { method: 'POST', datos: { correo, idioma, volver: rutaVolver() } });
          verCodigo(estado, correo);
        } catch (error) {
          avisar($aviso, error.message);
        }
      });
    });

    const google = estado.google ? el('a', { class: 'boton google', href: `/api/cuenta/google?volver=${encodeURIComponent(rutaVolver())}` }) : null;
    if (google) google.innerHTML = `${LOGO_GOOGLE}<span></span>`;
    google?.querySelector('span').append(t('cuenta.conGoogle'));

    $vista.replaceChildren(
      el('h1', {}, t('cuenta.entrarTitulo')),
      el('p', { class: 'entradilla' }, t('cuenta.entrarEntradilla')),
      el('section', { class: 'tarjeta' },
        google,
        google ? el('div', { class: 'separador' }, t('cuenta.o')) : null,
        $formulario),
    );
    if (!mensaje) $formulario.correo.focus();
  }

  // ?volver= como ruta de esta web (lo que guarda el servidor para el enlace del correo)
  function rutaVolver() {
    const url = new URL(volver, location.href);
    return url.origin === location.origin ? url.pathname + url.search + url.hash : '/';
  }

  // ─── 1b. El correo ya se ha enviado: código de 6 cifras ────────────────
  function verCodigo(estado, correo) {
    const $aviso = aviso();
    const $formulario = el('form', { novalidate: true },
      el('label', {}, t('cuenta.codigo'),
        el('input', { name: 'codigo', class: 'codigo', required: true, inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 7, placeholder: '000000' })),
      el('button', { class: 'boton ancho', type: 'submit' }, t('cuenta.entrarConCodigo')),
      $aviso,
    );
    $formulario.addEventListener('submit', (e) => {
      e.preventDefault();
      const codigo = $formulario.codigo.value.replace(/\D/g, '');
      if (codigo.length !== 6) return avisar($aviso, t('cuenta.errores.codigo_formato'));
      esperando($formulario.querySelector('button'), async () => {
        try {
          const { usuario } = await apiCuenta('/confirmar', { method: 'POST', datos: { correo, codigo } });
          await despues(usuario);
        } catch (error) {
          avisar($aviso, error.message);
        }
      });
    });

    $vista.replaceChildren(
      el('h1', {}, t('cuenta.revisaCorreo')),
      el('p', { class: 'entradilla' }, t('cuenta.revisaCorreoTexto', { correo })),
      el('section', { class: 'tarjeta' },
        el('h2', {}, t('cuenta.codigoTitulo')),
        el('p', { class: 'ayuda' }, t('cuenta.codigoTexto')),
        $formulario),
      el('button', { class: 'boton secundario', type: 'button', onclick: () => verCorreo(estado) }, t('cuenta.otroCorreo')),
    );
  }

  // Si se abre el enlace del correo en otra pestaña de este mismo navegador, esta se entera al volver a ella
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !$vista.querySelector('input.codigo')) return;
    const { usuario } = await estadoCuenta({ recargar: true });
    if (usuario) despues(usuario);
  });

  // ─── 2. Alias (la primera vez) ──────────────────────────────────────────
  function verAlias() {
    const $aviso = aviso();
    const $formulario = el('form', { novalidate: true },
      el('label', {}, el('span', {}, t('cuenta.alias')),
        el('input', { name: 'alias', required: true, minlength: 3, maxlength: 20, autocomplete: 'username', spellcheck: 'false', autocapitalize: 'off' }),
        el('small', {}, t('cuenta.aliasAyuda'))),
      el('label', {}, el('span', {}, t('cuenta.anio')),
        el('input', { name: 'anio', required: true, inputmode: 'numeric', maxlength: 4, autocomplete: 'bday-year', placeholder: '2000' }),
        el('small', {}, t('cuenta.anioAyuda'))),
      el('label', { class: 'casilla' }, el('input', { name: 'acepto', type: 'checkbox', required: true }), el('span', { 'data-acepto': '' })),
      el('button', { class: 'boton ancho', type: 'submit' }, t('cuenta.crearCuenta')),
      $aviso,
    );
    $formulario.querySelector('[data-acepto]').innerHTML = t('cuenta.acepto'); // texto nuestro con enlaces
    $formulario.addEventListener('submit', (e) => {
      e.preventDefault();
      const datos = { alias: $formulario.alias.value.trim(), anio: Number($formulario.anio.value), acepto: $formulario.acepto.checked };
      if (!/^[\p{L}\p{N}_.]{3,20}$/u.test(datos.alias)) return avisar($aviso, t('cuenta.errores.alias_formato'));
      if (!Number.isInteger(datos.anio) || String(datos.anio).length !== 4) return avisar($aviso, t('cuenta.errores.anio'));
      if (!datos.acepto) return avisar($aviso, t('cuenta.errores.acepto'));
      esperando($formulario.querySelector('button'), async () => {
        try {
          const { usuario } = await apiCuenta('/alias', { method: 'POST', datos });
          await despues(usuario);
        } catch (error) {
          if (error.codigo === 'edad') {
            // La cuenta se ha borrado en el servidor: no se guarda nada
            olvidarCuenta();
            $vista.replaceChildren(el('h1', {}, t('cuenta.entrarTitulo')), el('p', { class: 'aviso error' }, error.message),
              el('a', { class: 'boton', href: 'index.html' }, t('cuenta.irPortada')));
            return;
          }
          avisar($aviso, error.message);
        }
      });
    });

    $vista.replaceChildren(
      el('h1', {}, t('cuenta.aliasTitulo')),
      el('p', { class: 'entradilla' }, t('cuenta.aliasEntradilla')),
      el('section', { class: 'tarjeta' }, $formulario),
    );
    $formulario.alias.focus();
  }

  // ─── 3. Ya ha entrado ───────────────────────────────────────────────────
  async function despues(usuario) {
    if (!usuario.alias) return verAlias();
    $vista.replaceChildren(el('p', { class: 'entradilla' }, t('cuenta.entrando')));
    try { usuario = await fusionarNavegador(usuario); } catch { /* se reintenta en la siguiente página */ }
    $vista.replaceChildren(
      el('div', { class: 'perfil' }, avatar(usuario.alias, usuario.avatar, 64),
        el('div', {}, el('h1', {}, t('cuenta.bienvenida', { alias: usuario.alias })))),
      el('a', { class: 'boton', href: volver }, t('cuenta.continuar')),
    );
    location.replace(volver);
  }

  // ─── Inicio ─────────────────────────────────────────────────────────────
  async function iniciar() {
    // Enlace del correo: entrar.html?volver=…#acceso=TOKEN (el token no se envía al servidor hasta aquí)
    const acceso = new URLSearchParams(location.hash.slice(1)).get('acceso');
    if (acceso) history.replaceState(null, '', location.pathname + location.search);
    const estado = await estadoCuenta();
    if (estado.sinServidor) {
      $vista.replaceChildren(el('h1', {}, t('cuenta.entrarTitulo')), el('p', { class: 'aviso error' }, t('cuenta.errores.no_disponible')));
      return;
    }
    if (acceso) {
      $vista.replaceChildren(el('p', { class: 'entradilla' }, t('cuenta.entrando')));
      try {
        const { usuario } = await apiCuenta('/confirmar', { method: 'POST', datos: { token: acceso } });
        return despues(usuario);
      } catch (error) {
        // Si ya había entrado (por ejemplo, abrió el enlace dos veces), sigue adelante
        if (estado.usuario) return despues(estado.usuario);
        return verCorreo(estado, error.message);
      }
    }
    if (estado.usuario) return despues(estado.usuario);
    verCorreo(estado, parametros.get('error') === 'google' ? t('cuenta.errorGoogle') : '');
  }
  iniciar();
</script>
</body>
</html>
