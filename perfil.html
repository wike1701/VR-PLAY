<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="perfil.tituloPagina">Perfil · VR Play</title>
<script src="idiomas/detectar.js"></script>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="theme-color" content="#0f0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilos/cuenta.css">
<style>
  /* Perfil público: cabecera, números, juegos creados a partir de sus ideas e ideas en marcha. */
  .numeros { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 24px; color: var(--muted); font-size: 0.92rem; }
  .numeros strong { color: var(--fg); }
  .juegos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .juego { display: grid; gap: 8px; text-decoration: none; }
  .juego img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--surface-2); }
  .juego strong { font-size: 0.95rem; }
  .juego:hover strong { color: var(--accent-2); }
  .ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .ideas a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); text-decoration: none; }
  .ideas a:hover { border-color: var(--accent); }
  .ideas .titulo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .ideas .gustos { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .estado {
    flex: none;
    padding: 1px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    font-family: var(--font-display);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .estado.nueva { color: var(--accent-2); }
  .estado.estudio { color: #ffd740; }
  .estado.desarrollo { color: #ffab40; }
  .vacio { color: var(--muted); margin: 0; }
  .perfil .quien { flex: 1; min-width: 0; }
  .perfil .accion { flex: none; }
  .numeros a { color: var(--muted); text-decoration: none; }
  .numeros a:hover, .numeros a:hover strong { color: var(--accent-2); }
  .privado { font-family: var(--font-body); font-weight: 400; font-size: 0.8rem; color: var(--muted); }
  .boton.siguiendo:hover { color: var(--peligro); border-color: color-mix(in srgb, var(--peligro) 55%, transparent); }
  .volver { display: inline-block; margin-bottom: 16px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .volver:hover { color: var(--fg); }
  .personas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .personas a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
  .personas a:hover { border-color: var(--accent); }
  .personas strong { overflow-wrap: anywhere; }
  .records { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .records a { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); text-decoration: none; }
  .records a:hover { border-color: #ffd54f; }
  .records img { width: 40px; height: 40px; border-radius: 8px; flex: none; }
  .records .titulo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .records .valor { font-family: var(--font-display); font-weight: 700; white-space: nowrap; }
  .records .puesto { color: #ffd54f; font-family: var(--font-display); font-weight: 700; min-width: 2.6em; text-align: right; }
  /* Botón de la cuenta en la cabecera (shell/cuenta.js) */
  .boton-cuenta { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); font-size: 0.9rem; font-weight: 600; text-decoration: none; white-space: nowrap; flex: none; }
  .boton-cuenta:not(:has(.avatar)) { padding: 5px 14px; }
  .boton-cuenta:hover { border-color: var(--accent); }
  @media (max-width: 520px) {
    .perfil { flex-wrap: wrap; }
    .perfil .accion { width: 100%; }
    .menu { gap: 12px; }
    .boton-cuenta .texto { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="contenedor cabecera">
    <a class="logo" href="index.html">VR<span>·</span>Play</a>
    <nav class="menu" data-i18n-attr="aria-label:comun.secciones" aria-label="Secciones">
      <a href="index.html" data-i18n="comun.juegos">Juegos</a>
      <a href="foro.html" data-i18n="comun.sugerencias">Sugerencias</a>
      <span data-cuenta></span>
      <span data-selector-idioma></span>
    </nav>
  </div>
</header>

<main class="contenedor" id="vista" aria-live="polite"></main>

<footer class="contenedor">
  <a href="legal.html#privacidad" data-i18n="comun.privacidad">Privacidad</a> · <a href="legal.html#aviso-legal" data-i18n="comun.avisoLegal">Aviso legal</a>
</footer>

<script type="module">
  // Perfil de una cuenta (ver servidor/perfiles.js):
  //   perfil.html#alias             → el perfil público
  //   perfil.html#alias/seguidores  → quién le sigue (si no tiene las listas ocultas)
  //   perfil.html#alias/seguidos    → a quién sigue
  // En tu propio perfil salen además los ajustes de la cuenta y tus juegos con «me gusta» y guardados
  // (solo los ves tú: vienen de tu sesión, no del perfil público).
  import { t } from './idiomas/idiomas.js';
  import { JUEGOS } from './juegos/catalogo.js';
  import { estadoCuenta, avatar, fecha, botonSeguir, montarBotonCuenta } from './shell/cuenta.js';
  import { formatearValor } from './shell/clasificacion.js';

  const $vista = document.getElementById('vista');
  montarBotonCuenta();

  function el(etiqueta, atributos = {}, ...hijos) {
    const nodo = document.createElement(etiqueta);
    for (const [clave, valor] of Object.entries(atributos)) {
      if (valor === false || valor === null || valor === undefined) continue;
      if (clave === 'class') nodo.className = valor;
      else nodo.setAttribute(clave, valor === true ? '' : valor);
    }
    for (const hijo of hijos.flat()) {
      if (hijo === null || hijo === undefined || hijo === false) continue;
      nodo.append(hijo instanceof Node ? hijo : String(hijo));
    }
    return nodo;
  }
  const enlacePerfil = (alias, sufijo = '') => `perfil.html#${encodeURIComponent(alias)}${sufijo}`;

  // Miniaturas de juegos del catálogo (para los juegos de sus ideas, tus «me gusta» y tus guardados)
  const rejillaJuegos = (ids, vacio) => {
    const juegos = ids.map((id) => JUEGOS.find((j) => j.id === id)).filter(Boolean);
    return juegos.length
      ? el('div', { class: 'juegos' }, juegos.map((juego) => el('a', { class: 'juego', href: `play.html#${juego.id}` },
        el('img', { src: juego.miniatura, alt: '', loading: 'lazy' }), el('strong', {}, `▶ ${juego.titulo}`))))
      : el('p', { class: 'vacio' }, vacio);
  };

  function error(mensaje) {
    $vista.replaceChildren(el('h1', {}, mensaje), el('a', { class: 'boton', href: 'index.html' }, t('cuenta.irPortada')));
  }

  async function mostrar() {
    let ruta = '';
    try { ruta = decodeURIComponent(location.hash.slice(1)); } catch { /* vacía */ }
    const [alias, lista] = ruta.replace(/^@/, '').split('/');
    $vista.replaceChildren(el('p', { class: 'entradilla' }, t('comun.cargando')));
    window.scrollTo(0, 0);
    if (!alias) return error(t('cuenta.errores.perfil_no_encontrado'));

    let datos = null;
    let codigo = 'no_disponible';
    try {
      const r = await fetch(`/api/perfiles/${encodeURIComponent(alias)}`);
      if (r.ok) datos = await r.json();
      else if (r.status === 404) codigo = 'perfil_no_encontrado';
    } catch { /* sin servidor */ }
    if (!datos) return error(t(`cuenta.errores.${codigo}`));
    const p = datos.perfil;
    document.title = `${p.alias} · VR Play`;
    const { usuario } = await estadoCuenta();

    if (lista === 'seguidores' || lista === 'seguidos') return mostrarLista(p, lista);

    const $seguidores = el('strong', {}, p.seguidores);
    // Seguidores y seguidos: los números son públicos; las listas, si no las oculta
    const numero = (cual, $n) => {
      const contenido = [$n, ` ${t(`perfil.${cual}`, { n: cual === 'seguidores' ? p.seguidores : p.seguidos })}`];
      return p.listasOcultas && !p.esMio ? el('span', {}, contenido) : el('a', { href: enlacePerfil(p.alias, `/${cual}`) }, contenido);
    };
    const accion = p.esMio
      ? el('a', { class: 'boton mini secundario', href: 'cuenta.html' }, `⚙ ${t('perfil.ajustes')}`)
      : botonSeguir(p.alias, p.loSigues, {
        conSesion: !!usuario?.alias,
        mini: true,
        alCambiar: ({ seguidores }) => { $seguidores.textContent = seguidores; p.seguidores = seguidores; },
      });

    $vista.replaceChildren(...[
      el('div', { class: 'perfil' }, avatar(p.alias, p.avatar, 80),
        el('div', { class: 'quien' }, el('h1', {}, p.alias), el('p', {}, t('cuenta.miembroDesde', { fecha: fecha(p.creada) }))),
        el('div', { class: 'accion' }, accion)),
      el('p', { class: 'numeros' },
        numero('seguidores', $seguidores),
        numero('seguidos', el('strong', {}, p.seguidos)),
        el('span', {}, el('strong', {}, p.ideas), ` ${t('perfil.ideas', { n: p.ideas })}`),
        el('span', {}, el('strong', {}, `♥ ${p.meGusta}`), ` ${t('perfil.meGustaRecibidos', { n: p.meGusta })}`),
        el('span', {}, el('strong', {}, p.comentarios), ` ${t('perfil.comentarios', { n: p.comentarios })}`)),
      // Sus récords: el resultado y el puesto en cada clasificación
      el('section', { class: 'tarjeta' },
        el('h2', {}, `🏆 ${t('perfil.records')}`),
        p.records.length
          ? el('ul', { class: 'records' }, p.records.map((r) => {
            const juego = JUEGOS.find((j) => j.id === r.juego);
            if (!juego) return null;
            return el('li', {}, el('a', { href: `clasificacion.html#${juego.id}` },
              el('img', { src: juego.miniatura, alt: '', loading: 'lazy' }),
              el('span', { class: 'titulo' }, juego.titulo),
              el('span', { class: 'valor' }, formatearValor(r.juego, r.valor)),
              r.puesto ? el('span', { class: 'puesto' }, `#${r.puesto}`) : null));
          }))
          : el('p', { class: 'vacio' }, t('perfil.sinRecords'))),
      el('section', { class: 'tarjeta' },
        el('h2', {}, t('perfil.juegosDeSusIdeas')),
        rejillaJuegos(p.juegos.map((s) => s.juego), t('perfil.sinJuegos'))),
      el('section', { class: 'tarjeta' },
        el('h2', {}, t('perfil.ideasEnMarcha')),
        p.enMarcha.length
          ? el('ul', { class: 'ideas' }, p.enMarcha.map((s) => el('li', {}, el('a', { href: `foro.html#/s/${s.id}` },
            el('span', { class: `estado ${s.estado}` }, t(`foro.estados.${s.estado}`)),
            el('span', { class: 'titulo' }, s.titulo),
            el('span', { class: 'gustos' }, `♥ ${s.me_gusta}`)))))
          : el('p', { class: 'vacio' }, t('perfil.sinIdeas'))),
      // Solo en tu perfil: tus juegos con «me gusta» y guardados (de tu sesión)
      p.esMio && usuario ? el('section', { class: 'tarjeta' },
        el('h2', {}, `♥ ${t('perfil.tusMeGusta')} `, el('small', { class: 'privado' }, `🔒 ${t('perfil.soloTu')}`)),
        rejillaJuegos(usuario.meGusta, t('perfil.sinMeGusta'))) : null,
      p.esMio && usuario ? el('section', { class: 'tarjeta' },
        el('h2', {}, `★ ${t('perfil.tusGuardados')} `, el('small', { class: 'privado' }, `🔒 ${t('perfil.soloTu')}`)),
        rejillaJuegos(usuario.favoritos, t('perfil.sinGuardados'))) : null,
    ].filter(Boolean));
  }

  // Lista de seguidores o de seguidos
  async function mostrarLista(p, cual) {
    const volver = el('a', { class: 'volver', href: enlacePerfil(p.alias) }, `← ${t('perfil.volverPerfil', { alias: p.alias })}`);
    const titulo = el('h1', {}, t(cual === 'seguidores' ? 'perfil.listaSeguidores' : 'perfil.listaSeguidos', { alias: p.alias }));
    if (p.listasOcultas && !p.esMio) {
      return $vista.replaceChildren(volver, titulo, el('p', { class: 'entradilla' }, t('perfil.listasOcultas')));
    }
    let perfiles = [];
    try {
      const r = await fetch(`/api/perfiles/${encodeURIComponent(p.alias)}/${cual}`);
      if (r.ok) ({ perfiles } = await r.json());
    } catch { /* lista vacía */ }
    $vista.replaceChildren(volver, titulo, perfiles.length
      ? el('ul', { class: 'personas' }, perfiles.map((x) => el('li', {}, el('a', { href: enlacePerfil(x.alias) }, avatar(x.alias, x.avatar, 40), el('strong', {}, x.alias)))))
      : el('p', { class: 'entradilla' }, t('perfil.listaVacia')));
  }

  window.addEventListener('hashchange', mostrar);
  mostrar();
</script>
</body>
</html>
