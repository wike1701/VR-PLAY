<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#d9d2c4"/>
    </linearGradient>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa8e0"/>
      <stop offset="1" stop-color="#fff0d0"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tortita" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f0b860"/>
      <stop offset="1" stop-color="#c47e2c"/>
    </radialGradient>
    <linearGradient id="hierro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#16161a"/>
    </linearGradient>
    <radialGradient id="estela">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <g stroke="#c8c4bc" stroke-width="2"><path d="M0 60 H400"/><path d="M0 120 H400"/><path d="M0 180 H400"/><path d="M0 240 H400"/><path d="M60 0 V300"/><path d="M340 0 V300"/></g>
  <!-- Ventana -->
  <rect x="100" y="20" width="200" height="150" fill="url(#cielo)"/>
  <g fill="#5d9a46"><circle cx="140" cy="160" r="30"/><circle cx="260" cy="156" r="36"/></g>
  <rect x="100" y="20" width="200" height="150" fill="none" stroke="#2f6f8f" stroke-width="10"/>
  <rect x="196" y="20" width="8" height="150" fill="#2f6f8f"/>
  <!-- Encimera -->
  <rect x="0" y="300" width="400" height="20" fill="#8a8a86"/>
  <rect x="0" y="320" width="400" height="80" fill="#b07a48"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Pila de tortitas en el plato -->
  <ellipse cx="70" cy="300" rx="52" ry="10" fill="#f6f6f2"/>
  <g fill="#d2913a" stroke="#a86a24" stroke-width="2"><ellipse cx="70" cy="290" rx="40" ry="9"/><ellipse cx="70" cy="280" rx="40" ry="9"/><ellipse cx="70" cy="270" rx="40" ry="9"/></g>
  <path d="M56 262 q14 -10 28 0 q-6 14 -14 20 q-8 -6 -14 -20Z" fill="#f2a72e" opacity="0.9"/>
  <!-- Estela de la vuelta -->
  <path d="M170 280 C150 200 230 150 260 130" fill="none" stroke="#ff6a3d" stroke-width="7" stroke-linecap="round" opacity="0.8" stroke-dasharray="2 14"/>
  <circle cx="230" cy="140" r="70" fill="url(#estela)"/>
  <!-- Tortita en el aire, girando -->
  <g transform="rotate(-28 230 140)">
    <ellipse cx="230" cy="146" rx="64" ry="22" fill="#a86a24"/>
    <ellipse cx="230" cy="138" rx="64" ry="22" fill="url(#tortita)"/>
    <g fill="#a86a24" opacity="0.5"><circle cx="210" cy="134" r="3"/><circle cx="240" cy="140" r="3"/><circle cx="256" cy="132" r="2.5"/><circle cx="224" cy="144" r="2"/></g>
  </g>
  <ellipse cx="220" cy="350" rx="110" ry="16" fill="url(#sombra)"/>
  <!-- Sartén -->
  <path d="M100 300 Q105 340 160 344 L280 344 Q335 340 340 300Z" fill="url(#hierro)"/>
  <ellipse cx="220" cy="300" rx="120" ry="22" fill="#2a2a2e"/>
  <ellipse cx="220" cy="302" rx="104" ry="16" fill="#1c1c20"/>
  <rect x="330" y="300" width="80" height="20" rx="8" fill="#5a3a22" transform="rotate(12 330 300)"/>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
