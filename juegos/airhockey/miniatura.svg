<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140e22"/>
      <stop offset="0.6" stop-color="#2a1a48"/>
      <stop offset="1" stop-color="#120c1e"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9cde6"/>
      <stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff7ae0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7ae0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maza" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="0.6" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#a5150e"/>
    </linearGradient>
    <linearGradient id="disco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
    <linearGradient id="estela" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ff6a3d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd0b8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Pared del salón con neones -->
  <g fill="#3a2a4a" opacity="0.5">
    <rect x="0" y="40" width="400" height="3"/><rect x="0" y="80" width="400" height="3"/><rect x="0" y="120" width="400" height="3"/>
  </g>
  <circle cx="70" cy="70" r="60" fill="url(#halo)" opacity="0.6"/>
  <path d="M60 30 L86 70 L68 72 L84 112 L52 66 L70 64 Z" fill="none" stroke="#ffe14d" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="330" cy="72" r="64" fill="url(#halo)" opacity="0.6"/>
  <circle cx="330" cy="72" r="38" fill="none" stroke="#ff4fd8" stroke-width="6"/>
  <circle cx="330" cy="72" r="17" fill="none" stroke="#33e1ff" stroke-width="5"/>
  <!-- Marcador colgado -->
  <rect x="150" y="22" width="100" height="44" rx="6" fill="#1a1a26"/>
  <rect x="158" y="30" width="84" height="28" rx="3" fill="#0b0b12"/>
  <g fill="#ffd28a"><circle cx="156" cy="26" r="2.5"/><circle cx="176" cy="26" r="2.5"/><circle cx="196" cy="26" r="2.5"/><circle cx="216" cy="26" r="2.5"/><circle cx="236" cy="26" r="2.5"/></g>
  <g fill="#ff6a3d"><rect x="172" y="36" width="14" height="16" rx="2"/></g>
  <g fill="#33e1ff"><rect x="214" y="36" width="14" height="16" rx="2"/></g>
  <!-- Mesa en perspectiva -->
  <path d="M120 140 H280 L380 400 H20 Z" fill="#23233a"/>
  <path d="M132 148 H268 L356 400 H44 Z" fill="url(#mesa)"/>
  <path d="M170 148 H230 L232 154 H168 Z" fill="#23233a"/>
  <path d="M96 252 H304" stroke="#e53935" stroke-width="5"/>
  <ellipse cx="200" cy="252" rx="44" ry="15" fill="none" stroke="#e53935" stroke-width="4"/>
  <path d="M150 148 Q200 186 250 148" fill="none" stroke="#1e88e5" stroke-width="4"/>
  <path d="M120 140 H280" stroke="#33e1ff" stroke-width="3"/>
  <path d="M20 400 L120 140 M380 400 L280 140" stroke="#ff4fd8" stroke-width="4"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Estela del disco hacia la portería de enfrente -->
  <path d="M120 330 Q170 250 236 176 Q186 252 150 340 Z" fill="url(#estela)"/>
  <!-- Disco -->
  <ellipse cx="238" cy="180" rx="30" ry="12" fill="url(#sombra)"/>
  <ellipse cx="236" cy="172" rx="26" ry="11" fill="#b38600"/>
  <ellipse cx="236" cy="167" rx="26" ry="11" fill="url(#disco)"/>
  <ellipse cx="236" cy="167" rx="19" ry="7.5" fill="none" stroke="#ff6a3d" stroke-width="3"/>
  <!-- Maza en primer plano, golpeando -->
  <ellipse cx="148" cy="352" rx="96" ry="30" fill="url(#sombra)"/>
  <g transform="rotate(-22 140 320)">
    <ellipse cx="140" cy="334" rx="80" ry="30" fill="#8e130c"/>
    <ellipse cx="140" cy="322" rx="80" ry="30" fill="url(#maza)"/>
    <ellipse cx="140" cy="318" rx="62" ry="22" fill="none" stroke="#ffb3a8" stroke-width="3" opacity="0.6"/>
    <path d="M118 318 Q122 280 128 254 H152 Q158 280 162 318 Z" fill="url(#maza)"/>
    <ellipse cx="140" cy="250" rx="30" ry="14" fill="#c4231a"/>
    <ellipse cx="140" cy="244" rx="30" ry="14" fill="url(#maza)"/>
    <ellipse cx="132" cy="240" rx="11" ry="4" fill="#ffffff" opacity="0.45"/>
  </g>
  <!-- Chispas del golpe -->
  <g fill="#ffd0b8"><circle cx="206" cy="214" r="4"/><circle cx="190" cy="196" r="3"/><circle cx="222" cy="226" r="3"/></g>
  <g fill="#ff6a3d"><circle cx="212" cy="196" r="3.5"/><circle cx="198" cy="230" r="2.5"/></g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
