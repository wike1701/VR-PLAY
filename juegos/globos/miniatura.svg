<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1440"/>
      <stop offset="1" stop-color="#4a3a7a"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="globo">
      <path d="M0 26 L0 60" stroke="#eee" stroke-width="2" fill="none"/>
      <path d="M-5 30 L5 30 L0 24 Z" fill="inherit"/>
      <ellipse rx="21" ry="26"/>
      <ellipse rx="21" ry="26" fill="url(#brillo)"/>
    </g>
  </defs>
  <rect width="400" height="400" fill="url(#cielo)"/>
  <!-- Paredes de la caseta -->
  <rect x="0" y="60" width="400" height="340" fill="#8a5a32"/>
  <!-- Corcho con marco -->
  <rect x="34" y="96" width="332" height="220" fill="#b98a57" stroke="#6d4425" stroke-width="10"/>
  <g fill="#7a5530" opacity="0.35">
    <circle cx="70" cy="130" r="2"/><circle cx="160" cy="300" r="2"/><circle cx="300" cy="140" r="2"/>
    <circle cx="240" cy="230" r="2"/><circle cx="110" cy="250" r="2"/><circle cx="330" cy="280" r="2"/>
  </g>
  <!-- Globos del tablero -->
  <use href="#globo" x="80" y="136" fill="#e53935"/>
  <use href="#globo" x="140" y="136" fill="#1e88e5"/>
  <use href="#globo" x="260" y="136" fill="#43a047"/>
  <use href="#globo" x="320" y="136" fill="#8e24aa"/>
  <use href="#globo" x="110" y="222" fill="#fb8c00"/>
  <use href="#globo" x="230" y="222" fill="#ec407a"/>
  <use href="#globo" x="290" y="222" fill="#00acc1"/>
  <!-- Globo dorado que sube -->
  <use href="#globo" x="190" y="180" fill="#ffc107"/>
  <!-- Globo reventado -->
  <g transform="translate(170 250)" fill="#fdd835">
    <path d="M-18 -10 L-8 -4 L-14 4 Z"/><path d="M14 -14 L6 -2 L18 0 Z"/>
    <path d="M-4 14 L4 6 L10 18 Z"/><path d="M-20 12 L-10 8 L-12 20 Z"/>
    <path d="M0 -6 L-6 -24 M8 4 L26 10 M-6 6 L-24 22 M2 -2 L4 -26" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- Toldo de rayas -->
  <g>
    <rect x="0" y="0" width="400" height="62" fill="#f4f1ea"/>
    <rect x="0" y="0" width="50" height="62" fill="#d32f2f"/>
    <rect x="100" y="0" width="50" height="62" fill="#d32f2f"/>
    <rect x="200" y="0" width="50" height="62" fill="#d32f2f"/>
    <rect x="300" y="0" width="50" height="62" fill="#d32f2f"/>
    <circle cx="25" cy="62" r="25" fill="#d32f2f"/><circle cx="75" cy="62" r="25" fill="#f4f1ea"/>
    <circle cx="125" cy="62" r="25" fill="#d32f2f"/><circle cx="175" cy="62" r="25" fill="#f4f1ea"/>
    <circle cx="225" cy="62" r="25" fill="#d32f2f"/><circle cx="275" cy="62" r="25" fill="#f4f1ea"/>
    <circle cx="325" cy="62" r="25" fill="#d32f2f"/><circle cx="375" cy="62" r="25" fill="#f4f1ea"/>
  </g>
  <!-- Bombillas -->
  <g>
    <circle cx="20" cy="94" r="5" fill="#ffe082"/><circle cx="70" cy="98" r="5" fill="#ff8a65"/>
    <circle cx="120" cy="94" r="5" fill="#80deea"/><circle cx="170" cy="98" r="5" fill="#ffe082"/>
    <circle cx="230" cy="94" r="5" fill="#ff8a65"/><circle cx="280" cy="98" r="5" fill="#80deea"/>
    <circle cx="330" cy="94" r="5" fill="#ffe082"/><circle cx="380" cy="98" r="5" fill="#ff8a65"/>
  </g>
  <!-- Mostrador -->
  <rect x="0" y="330" width="400" height="70" fill="#b07a4a"/>
  <rect x="0" y="322" width="400" height="14" fill="#c8915c"/>
  <!-- Dardo en vuelo -->
  <g transform="translate(250 300) rotate(-32)">
    <path d="M0 0 L-14 -3 L-14 3 Z" fill="#dfe3e6"/>
    <rect x="-14" y="-4" width="34" height="8" rx="3" fill="#8d6e63"/>
    <rect x="20" y="-1.5" width="30" height="3" fill="#263238"/>
    <path d="M40 0 L62 -14 L66 -14 L56 0 L66 14 L62 14 Z" fill="#e53935"/>
  </g>
</svg>
