  <path d="M56 262 L344 262 L380 400 H20 Z" fill="url(#tapete)"/>
  <ellipse cx="90" cy="330" rx="46" ry="16" fill="url(#agujero)"/>
  <ellipse cx="330" cy="300" rx="38" ry="13" fill="url(#agujero)"/>
