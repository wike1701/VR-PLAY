<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f2a"/>
      <stop offset="1" stop-color="#3a1f3c"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.45" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tapete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc16a"/>
      <stop offset="1" stop-color="#3f8a3a"/>
    </linearGradient>
    <radialGradient id="agujero" cy="0.4">
      <stop offset="0.5" stop-color="#0d0a08"/>
      <stop offset="1" stop-color="#2b1d12"/>
    </radialGradient>
    <radialGradient id="piel" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b58358"/>
      <stop offset="0.6" stop-color="#7a5232"/>
      <stop offset="1" stop-color="#4a2f1c"/>
    </radialGradient>
    <linearGradient id="cabeza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#b3202a"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a272"/>
