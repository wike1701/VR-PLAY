  <ellipse cx="200" cy="268" rx="30" ry="24" fill="#e9c9a3"/>
  <ellipse cx="200" cy="254" rx="11" ry="8" fill="#ff8aa0"/>
  <rect x="192" y="266" width="7" height="10" rx="2" fill="#fff"/><rect x="201" y="266" width="7" height="10" rx="2" fill="#fff"/>
  <path d="M174 228 l10 6 M186 222 l-2 10" stroke="#1b1210" stroke-width="5" stroke-linecap="round"/>
  <path d="M226 228 l-10 6 M214 222 l2 10" stroke="#1b1210" stroke-width="5" stroke-linecap="round"/>
