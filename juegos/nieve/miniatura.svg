  <circle cx="190" cy="160" r="56" fill="url(#estalla)"/>
  <g fill="#ffffff"><circle cx="160" cy="132" r="9"/><circle cx="214" cy="126" r="7"/><circle cx="150" cy="176" r="6"/><circle cx="200" cy="190" r="5"/></g>
  <circle cx="180" cy="158" r="22" fill="url(#bola)"/>
