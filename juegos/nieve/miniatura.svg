  <circle cx="60" cy="90" r="18" fill="url(#bola)"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"><path d="M20 70 l22 10"/><path d="M14 92 l26 0"/></g>
  <rect width="400" height="400" fill="url(#vineta)"/>
