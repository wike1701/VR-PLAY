<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fd0"/>
      <stop offset="0.55" stop-color="#f6d9b0"/>
      <stop offset="1" stop-color="#f6d9b0"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cbf58"/>
      <stop offset="1" stop-color="#3f7a32"/>
    </linearGradient>
    <linearGradient id="varilla" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a9098"/>
