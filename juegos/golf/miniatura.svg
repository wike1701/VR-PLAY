  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <path d="M0 190 Q100 150 200 175 T400 165 V220 H0Z" fill="#5d8a4e"/>
  <g fill="#2f5a2a"><circle cx="40" cy="180" r="22"/><circle cx="72" cy="186" r="16"/><circle cx="340" cy="176" r="24"/><circle cx="372" cy="184" r="16"/></g>
  <rect x="0" y="200" width="400" height="200" fill="url(#cesped)"/>
  <g fill="#ffffff" opacity="0.12"><path d="M150 200 L250 200 L330 400 L70 400Z"/></g>
  <!-- Green lejano con bandera coral -->
  <ellipse cx="250" cy="214" rx="46" ry="8" fill="#9ad874"/>
  <rect x="249" y="166" width="3" height="48" fill="#f2f2f2"/>
  <path d="M252 166 L278 174 L252 182Z" fill="#ff6a3d"/>
  <!-- Vuelo de la bola -->
  <path d="M200 330 Q230 150 300 120" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" opacity="0.8"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <ellipse cx="200" cy="352" rx="90" ry="14" fill="url(#sombra)"/>
