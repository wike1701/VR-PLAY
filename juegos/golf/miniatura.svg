  <rect x="44" y="10" width="22" height="70" rx="8" fill="#1c1c22" transform="rotate(-22 55 45)"/>
  <ellipse cx="172" cy="330" rx="34" ry="18" fill="#2a2f3a" transform="rotate(-10 172 330)"/>
