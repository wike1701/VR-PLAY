  <rect width="400" height="400" fill="url(#fondo)"/>
  <circle cx="300" cy="150" r="34" fill="#fff1d6" opacity="0.8"/>
  <!-- Montes, valle y camino -->
  <path d="M0 196 Q90 150 170 186 Q260 140 330 176 Q370 166 400 172 V400 H0 Z" fill="#51625a"/>
  <path d="M0 214 Q120 196 220 210 Q320 198 400 206 V400 H0 Z" fill="#5f8a42"/>
  <path d="M250 214 Q236 240 262 262 Q290 288 240 330 L330 330 Q356 288 300 262 Q276 240 266 214 Z" fill="#9a7650"/>
  <g fill="#2f5a3a"><path d="M40 238 L56 196 L72 238 Z"/><path d="M350 236 L366 194 L382 236 Z"/><path d="M196 226 L208 196 L220 226 Z"/></g>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Globo con cofre -->
  <path d="M96 106 L104 134 M124 106 L116 134" stroke="#3a2a1a" stroke-width="3"/>
  <ellipse cx="110" cy="82" rx="30" ry="36" fill="url(#globo)"/>
  <rect x="98" y="132" width="24" height="16" rx="2" fill="#7a4a24"/>
  <rect x="98" y="132" width="24" height="4" fill="#d4a53a"/>
