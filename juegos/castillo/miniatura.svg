<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e5a9a"/>
      <stop offset="0.55" stop-color="#ffb27a"/>
      <stop offset="1" stop-color="#f0a070"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.62" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piedraMuro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0a596"/>
      <stop offset="1" stop-color="#6a6258"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#7a4a24"/>
    </linearGradient>
    <radialGradient id="globo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff0a0"/>
