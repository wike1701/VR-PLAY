  <ellipse cx="282" cy="276" rx="18" ry="5" fill="url(#sombra)"/>
  <g transform="rotate(-18 282 272)">
    <rect x="274" y="248" width="16" height="24" rx="3" fill="#9a2030"/>
    <circle cx="282" cy="242" r="7" fill="#d9a77a"/>
    <path d="M274 240 Q282 228 290 240 Z" fill="#8a909a"/>
  </g>
  <circle cx="282" cy="250" r="34" fill="url(#impacto)"/>
