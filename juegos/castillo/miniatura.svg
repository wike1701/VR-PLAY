  <path d="M150 300 Q196 160 276 246 Q206 196 162 306 Z" fill="url(#estela)"/>
  <circle cx="270" cy="244" r="9" fill="url(#roca)"/>
  <!-- Almenas -->
  <rect x="0" y="318" width="400" height="82" fill="url(#piedraMuro)"/>
  <rect x="0" y="282" width="70" height="40" fill="url(#piedraMuro)"/>
  <rect x="330" y="282" width="70" height="40" fill="url(#piedraMuro)"/>
  <g stroke="#5a5248" stroke-width="3" opacity="0.7"><path d="M0 346 H400 M0 374 H400 M60 318 V346 M160 318 V346 M260 318 V346 M110 346 V374 M210 346 V374 M310 346 V374"/></g>
  <!-- Tirachinas en primer plano, con la goma estirada -->
  <g transform="translate(150 400) scale(1.55) translate(-150 -400)">
  <path d="M136 400 L150 318 L162 318 L156 400 Z" fill="url(#madera)"/>
  <path d="M150 322 L118 262 L130 256 L160 316 Z" fill="url(#madera)"/>
  <path d="M158 316 L182 252 L194 258 L168 322 Z" fill="url(#madera)"/>
  <path d="M124 258 L150 300 L188 254" stroke="#c8a050" stroke-width="5" fill="none"/>
  <rect x="140" y="294" width="20" height="12" rx="3" fill="#6a3a1e"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
