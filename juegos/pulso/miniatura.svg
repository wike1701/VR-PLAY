    <rect x="-34" y="56" width="76" height="30" rx="3"/><rect x="48" y="56" width="76" height="30" rx="3"/><rect x="130" y="56" width="76" height="30" rx="3"/><rect x="212" y="56" width="76" height="30" rx="3"/><rect x="294" y="56" width="76" height="30" rx="3"/>
    <rect x="4" y="92" width="76" height="30" rx="3"/><rect x="86" y="92" width="76" height="30" rx="3"/><rect x="168" y="92" width="76" height="30" rx="3"/><rect x="250" y="92" width="76" height="30" rx="3"/><rect x="332" y="92" width="76" height="30" rx="3"/>
    <rect x="-34" y="128" width="76" height="30" rx="3"/><rect x="48" y="128" width="76" height="30" rx="3"/><rect x="130" y="128" width="76" height="30" rx="3"/><rect x="212" y="128" width="76" height="30" rx="3"/><rect x="294" y="128" width="76" height="30" rx="3"/>
    <rect x="4" y="164" width="76" height="30" rx="3"/><rect x="86" y="164" width="76" height="30" rx="3"/><rect x="168" y="164" width="76" height="30" rx="3"/><rect x="250" y="164" width="76" height="30" rx="3"/><rect x="332" y="164" width="76" height="30" rx="3"/>
