<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2420"/>
      <stop offset="1" stop-color="#1e1412"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cobre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd09a"/>
      <stop offset="1" stop-color="#a3561f"/>
