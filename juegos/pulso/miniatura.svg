  <rect x="30" y="182" width="38" height="14" rx="4" fill="#2e7d32"/><rect x="332" y="142" width="38" height="14" rx="4" fill="#ffc400"/>
  <path d="M49 190 C90 120 120 260 170 200 S250 110 290 190 S340 220 351 150" fill="none" stroke="url(#cobre)" stroke-width="8" stroke-linecap="round"/>
