<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#3e4658"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Muñeco inocente al fondo -->
  <g transform="translate(300 120) scale(0.6)">
    <rect x="-8" y="150" width="16" height="60" fill="#8d6e63"/>
    <rect x="-55" y="60" width="110" height="170" fill="#42a5f5"/>
    <circle cx="0" cy="20" r="34" fill="#ffcc80"/>
    <circle cx="-12" cy="14" r="5" fill="#111"/>
    <circle cx="12" cy="14" r="5" fill="#111"/>
    <path d="M-14 28 Q0 40 14 28" stroke="#111" stroke-width="4" fill="none"/>
  </g>
  <!-- Muñeco malo con diana -->
  <rect x="146" y="296" width="20" height="60" fill="#8d6e63"/>
  <rect x="100" y="160" width="112" height="150" fill="#d84315"/>
  <circle cx="156" cy="228" r="36" fill="#fff"/>
  <circle cx="156" cy="228" r="23" fill="#c62828"/>
  <circle cx="156" cy="228" r="10" fill="#fff"/>
  <circle cx="156" cy="118" r="38" fill="#ffcc80"/>
  <rect x="122" y="104" width="68" height="18" fill="#111"/>
  <rect x="80" y="352" width="152" height="18" fill="#2c3240"/>
  <!-- Láser y pistola -->
  <line x1="330" y1="330" x2="160" y2="228" stroke="#ff5252" stroke-width="4" opacity="0.8"/>
  <g transform="translate(330 330) rotate(31)">
    <rect x="-6" y="-14" width="80" height="24" rx="4" fill="#37474f"/>
    <rect x="40" y="6" width="24" height="52" rx="5" fill="#5d4037" transform="rotate(14 52 6)"/>
  </g>
  <!-- Chispas -->
  <g fill="#ffe082">
    <path d="M196 196 l12 -8 -4 14z"/>
    <path d="M118 194 l-14 -6 8 12z"/>
    <path d="M190 262 l14 6 -12 4z"/>
  </g>
</svg>
