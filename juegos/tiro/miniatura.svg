<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a2c"/>
      <stop offset="1" stop-color="#2a1d24"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.45" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffd8a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd8a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tabla" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6d3a"/>
      <stop offset="1" stop-color="#c53a1e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7480"/>
      <stop offset="1" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="cachas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5638"/>
      <stop offset="1" stop-color="#4f2c1a"/>
    </linearGradient>
    <radialGradient id="fogonazo">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="0.35" stop-color="#ff6a3d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Carpa a rayas y bombillas -->
  <g opacity="0.85">
    <rect x="0" y="40" width="40" height="230" fill="#a61f2e"/><rect x="80" y="40" width="40" height="230" fill="#a61f2e"/>
    <rect x="160" y="40" width="40" height="230" fill="#a61f2e"/><rect x="240" y="40" width="40" height="230" fill="#a61f2e"/>
    <rect x="320" y="40" width="40" height="230" fill="#a61f2e"/>
    <rect x="40" y="40" width="40" height="230" fill="#d9cdb8"/><rect x="120" y="40" width="40" height="230" fill="#d9cdb8"/>
    <rect x="200" y="40" width="40" height="230" fill="#d9cdb8"/><rect x="280" y="40" width="40" height="230" fill="#d9cdb8"/>
    <rect x="360" y="40" width="40" height="230" fill="#d9cdb8"/>
  </g>
  <g fill="#ffd54f"><circle cx="20" cy="48" r="5"/><circle cx="80" cy="56" r="5"/><circle cx="140" cy="60" r="5"/><circle cx="200" cy="62" r="5"/><circle cx="260" cy="60" r="5"/><circle cx="320" cy="56" r="5"/><circle cx="380" cy="48" r="5"/></g>
  <rect x="0" y="270" width="400" height="130" fill="#6b4a33"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Diana grande -->
  <ellipse cx="170" cy="282" rx="70" ry="10" fill="#05060a" opacity="0.45"/>
  <rect x="160" y="228" width="20" height="56" fill="#3a2a20"/>
  <rect x="96" y="84" width="148" height="150" rx="14" fill="url(#tabla)"/>
  <circle cx="170" cy="158" r="56" fill="#fff4e6"/>
  <circle cx="170" cy="158" r="42" fill="#d62f2f"/>
  <circle cx="170" cy="158" r="28" fill="#fff4e6"/>
  <circle cx="170" cy="158" r="14" fill="#d62f2f"/>
  <!-- Impacto en el centro -->
  <circle cx="170" cy="158" r="34" fill="url(#fogonazo)"/>
  <circle cx="170" cy="158" r="5" fill="#1b1010"/>
  <!-- Láser de la pistola -->
  <path d="M300 300 L174 160" stroke="#69f0ae" stroke-width="3" opacity="0.7"/>
  <!-- Pistola en primer plano -->
  <g transform="rotate(-42 300 320)">
    <rect x="230" y="296" width="150" height="34" rx="6" fill="url(#metal)"/>
    <g fill="#1d2228" opacity="0.7"><rect x="340" y="298" width="4" height="30"/><rect x="350" y="298" width="4" height="30"/><rect x="360" y="298" width="4" height="30"/></g>
    <rect x="236" y="298" width="130" height="5" rx="2" fill="#ffffff" opacity="0.25"/>
    <rect x="236" y="288" width="8" height="10" fill="#2a3038"/>
    <path d="M330 328 L374 328 L380 400 L330 400 Z" fill="url(#cachas)"/>
    <path d="M304 328 Q300 352 322 352 L330 352" fill="none" stroke="#2a3038" stroke-width="6"/>
    <circle cx="226" cy="313" r="26" fill="url(#fogonazo)"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
