  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Pared del puesto y toldo a rayas -->
  <rect x="0" y="64" width="400" height="260" fill="url(#pared)"/>
  <g fill="#3a2a1c" opacity="0.4"><rect x="0" y="130" width="400" height="4"/><rect x="0" y="200" width="400" height="4"/><rect x="0" y="270" width="400" height="4"/></g>
  <g>
    <rect x="0" y="0" width="400" height="64" fill="#f1e8d2"/>
    <g fill="#3f8f93">
      <rect x="0" y="0" width="40" height="64"/><rect x="80" y="0" width="40" height="64"/><rect x="160" y="0" width="40" height="64"/>
      <rect x="240" y="0" width="40" height="64"/><rect x="320" y="0" width="40" height="64"/>
    </g>
    <g fill="#f1e8d2"><circle cx="20" cy="64" r="20"/><circle cx="100" cy="64" r="20"/><circle cx="180" cy="64" r="20"/><circle cx="260" cy="64" r="20"/><circle cx="340" cy="64" r="20"/></g>
    <g fill="#3f8f93"><circle cx="60" cy="64" r="20"/><circle cx="140" cy="64" r="20"/><circle cx="220" cy="64" r="20"/><circle cx="300" cy="64" r="20"/><circle cx="380" cy="64" r="20"/></g>
  </g>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Mesa -->
  <rect x="0" y="336" width="400" height="64" fill="#3b2b24"/>
  <ellipse cx="200" cy="346" rx="150" ry="16" fill="url(#sombra)"/>
  <!-- Caja: fondo, frutas amontonadas y paredes -->
  <rect x="76" y="136" width="248" height="206" fill="url(#interior)"/>
  <circle cx="158" cy="278" r="60" fill="url(#sandia)"/>
  <path d="M158 218 Q132 278 158 338 M158 218 Q184 278 158 338 M120 240 Q112 284 134 330 M196 240 Q204 284 182 330" fill="none" stroke="#1e5a2c" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="136" cy="248" rx="20" ry="11" fill="url(#brillo)" transform="rotate(-30 136 248)"/>
  <circle cx="260" cy="294" r="46" fill="url(#melon)"/>
  <path d="M260 248 Q238 294 260 340 M260 248 Q282 294 260 340" fill="none" stroke="#f6fbd0" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="244" cy="270" rx="14" ry="8" fill="url(#brillo)" transform="rotate(-30 244 270)"/>
  <rect x="56" y="136" width="22" height="214" rx="4" fill="url(#madera)"/>
  <rect x="322" y="136" width="22" height="214" rx="4" fill="url(#madera)"/>
  <rect x="50" y="126" width="34" height="14" rx="5" fill="url(#madera)"/>
  <rect x="316" y="126" width="34" height="14" rx="5" fill="url(#madera)"/>
  <rect x="56" y="336" width="288" height="18" rx="4" fill="url(#madera)"/>
  <!-- Acción: la fruta que cae deja su trayecto y las dos naranjas se funden en un estallido -->
  <path d="M207 12 L207 96" stroke="#ff6a3d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.85"/>
  <g stroke="#ff6a3d" stroke-width="7" stroke-linecap="round">
    <path d="M207 150 L207 128"/><path d="M168 160 L152 144"/><path d="M246 160 L262 144"/>
    <path d="M144 196 L124 190"/><path d="M270 196 L290 190"/>
  </g>
  <circle cx="207" cy="196" r="14" fill="#ff6a3d" opacity="0.8"/>
  <!-- Las dos naranjas que se tocan -->
  <ellipse cx="207" cy="238" rx="92" ry="9" fill="url(#sombra)" opacity="0.5"/>
  <circle cx="168" cy="196" r="42" fill="url(#naranja)"/>
  <circle cx="246" cy="196" r="42" fill="url(#naranja)"/>
  <ellipse cx="154" cy="178" rx="17" ry="10" fill="url(#brillo)" transform="rotate(-30 154 178)"/>
  <ellipse cx="232" cy="178" rx="17" ry="10" fill="url(#brillo)" transform="rotate(-30 232 178)"/>
  <g fill="#4f8f2f"><ellipse cx="168" cy="155" rx="8" ry="4"/><ellipse cx="246" cy="155" rx="8" ry="4"/></g>
  <!-- Manzana de la siguiente fusión, al lado -->
  <circle cx="340" cy="92" r="26" fill="url(#manzana)"/>
  <path d="M340 66 Q342 56 348 52" stroke="#6d4a2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="331" cy="82" rx="9" ry="5" fill="url(#brillo)" transform="rotate(-30 331 82)"/>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
