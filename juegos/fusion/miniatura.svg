<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb6cf"/>
      <stop offset="0.55" stop-color="#9fd1d4"/>
      <stop offset="1" stop-color="#58727a"/>
    </linearGradient>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a49"/>
      <stop offset="1" stop-color="#5e4630"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4a06a"/>
      <stop offset="1" stop-color="#8d5f38"/>
    </linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5238"/>
      <stop offset="1" stop-color="#43301f"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="naranja" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#c85a10"/>
    </radialGradient>
    <radialGradient id="sandia" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#8fd97a"/>
      <stop offset="0.55" stop-color="#3f9a4a"/>
      <stop offset="1" stop-color="#1e5a2c"/>
    </radialGradient>
    <radialGradient id="melon" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f1f7c0"/>
      <stop offset="0.55" stop-color="#c3de84"/>
      <stop offset="1" stop-color="#84a64c"/>
    </radialGradient>
    <radialGradient id="manzana" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ff8f84"/>
      <stop offset="0.5" stop-color="#e0303f"/>
      <stop offset="1" stop-color="#8e1228"/>
    </radialGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
