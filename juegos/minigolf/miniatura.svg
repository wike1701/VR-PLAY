<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8e0"/>
      <stop offset="1" stop-color="#bfe3f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#cielo)"/>
  <!-- Prado -->
  <rect x="0" y="170" width="400" height="230" fill="#2f7d38"/>
  <!-- Árboles -->
  <g>
    <rect x="44" y="140" width="10" height="34" fill="#6d4c41"/>
    <path d="M49 82 L80 150 L18 150 Z" fill="#2e7d32"/>
    <rect x="344" y="132" width="10" height="40" fill="#6d4c41"/>
    <path d="M349 70 L384 144 L314 144 Z" fill="#2e7d32"/>
  </g>
  <!-- Recorrido en L con paredes de madera -->
  <path d="M120 380 L120 230 L300 230 L300 300 L190 300 L190 380 Z" fill="#43b04a" stroke="#a0703f" stroke-width="12" stroke-linejoin="round"/>
  <!-- Molino -->
  <g transform="translate(155 262) rotate(-25)">
    <rect x="-34" y="-5" width="68" height="10" rx="3" fill="#5c6bc0"/>
    <circle r="8" fill="#3949ab"/>
  </g>
  <!-- Poste -->
  <circle cx="250" cy="275" r="8" fill="#ffb300"/>
  <!-- Hoyo y bandera -->
  <ellipse cx="272" cy="252" rx="13" ry="6" fill="#111"/>
  <rect x="270" y="150" width="4" height="102" fill="#fff"/>
  <path d="M274 150 L318 165 L274 180 Z" fill="#e53935"/>
  <!-- Bola y trayectoria -->
  <path d="M156 360 Q150 320 168 300 Q210 268 255 255" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 7" opacity="0.8"/>
  <circle cx="156" cy="360" r="9" fill="#fff" stroke="#cfd8dc" stroke-width="2"/>
  <!-- Palo -->
  <g transform="translate(132 366) rotate(-18)">
    <rect x="-3" y="-120" width="6" height="120" fill="#b0bec5"/>
    <rect x="-4" y="-150" width="8" height="34" rx="3" fill="#212121"/>
    <rect x="-6" y="-2" width="26" height="10" rx="2" fill="#37474f"/>
  </g>
</svg>
