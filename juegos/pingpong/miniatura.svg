<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2338"/>
      <stop offset="0.62" stop-color="#2c3a5c"/>
      <stop offset="0.62" stop-color="#b07b4a"/>
      <stop offset="1" stop-color="#8a5d34"/>
    </linearGradient>
    <radialGradient id="bola" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="0.5" stop-color="#ff8f00"/>
      <stop offset="1" stop-color="#c25e00"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Mesa en perspectiva -->
  <path d="M30 330 L370 330 L300 200 L100 200 Z" fill="#1d4f91"/>
  <path d="M30 330 L370 330 L300 200 L100 200 Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <line x1="200" y1="200" x2="200" y2="330" stroke="#fff" stroke-width="3"/>
  <rect x="30" y="330" width="340" height="12" fill="#14385f"/>
  <!-- Red -->
  <rect x="62" y="236" width="276" height="26" fill="#111" opacity="0.55"/>
  <rect x="62" y="236" width="276" height="5" fill="#f5f5f5"/>
  <!-- Trayectoria y bola -->
  <path d="M110 300 Q190 120 262 214" fill="none" stroke="#ffcc80" stroke-width="3" stroke-dasharray="8 10" opacity="0.8"/>
  <circle cx="232" cy="150" r="17" fill="url(#bola)"/>
  <!-- Pala -->
  <g transform="translate(320 120) rotate(35)">
    <rect x="-10" y="40" width="20" height="62" rx="6" fill="#d7a86e"/>
    <ellipse cx="0" cy="0" rx="50" ry="56" fill="#c62828"/>
    <ellipse cx="-12" cy="-16" rx="18" ry="12" fill="#fff" opacity="0.15"/>
  </g>
  <!-- Líneas de movimiento -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="262" y1="70" x2="246" y2="52"/>
    <line x1="290" y1="56" x2="280" y2="36"/>
  </g>
</svg>
