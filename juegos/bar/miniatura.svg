<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f16"/>
      <stop offset="0.6" stop-color="#3b1e24"/>
      <stop offset="1" stop-color="#22140e"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4526"/>
      <stop offset="1" stop-color="#3a1f10"/>
    </linearGradient>
    <linearGradient id="botella" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15a"/>
      <stop offset="0.5" stop-color="#e8890f"/>
      <stop offset="1" stop-color="#8f4a05"/>
    </linearGradient>
    <linearGradient id="etiqueta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e2"/>
      <stop offset="1" stop-color="#d9c8a4"/>
    </linearGradient>
    <linearGradient id="cristal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b9d4e6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="liquido" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#c2302a"/>
    </linearGradient>
    <linearGradient id="chorro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Estantería del fondo con botellas -->
  <g fill="#160b0a" opacity="0.7">
    <rect x="0" y="118" width="400" height="7"/><rect x="0" y="196" width="400" height="7"/>
    <rect x="22" y="72" width="18" height="46" rx="5"/><rect x="58" y="84" width="16" height="34" rx="5"/><rect x="330" y="76" width="18" height="42" rx="5"/><rect x="364" y="88" width="15" height="30" rx="5"/>
    <rect x="30" y="152" width="17" height="44" rx="5"/><rect x="66" y="160" width="15" height="36" rx="5"/><rect x="318" y="156" width="18" height="40" rx="5"/><rect x="352" y="148" width="16" height="48" rx="5"/>
  </g>
  <!-- Barra de madera -->
  <path d="M0 300 L400 288 L400 400 L0 400 Z" fill="url(#barra)"/>
  <path d="M0 300 L400 288 L400 298 L0 311 Z" fill="#a8683d" opacity="0.7"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <ellipse cx="262" cy="338" rx="92" ry="13" fill="url(#sombra)"/>
  <!-- Vaso con el cóctel -->
  <path d="M186 214 L338 214 L322 334 Q262 344 202 334 Z" fill="url(#cristal)"/>
  <path d="M193 262 L331 262 L322 332 Q262 342 202 332 Z" fill="url(#liquido)"/>
  <ellipse cx="262" cy="262" rx="69" ry="9" fill="#ffc09a"/>
  <rect x="226" y="242" width="38" height="34" rx="7" fill="#e6f7ff" opacity="0.85" transform="rotate(-14 245 259)"/>
  <path d="M198 224 L210 326" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="262" cy="214" rx="76" ry="10" fill="none" stroke="#f0faff" stroke-width="5" opacity="0.8"/>
  <!-- Chorro y salpicaduras (la acción) -->
  <path d="M255 196 Q262 226 268 262 L256 262 Q252 228 247 200 Z" fill="url(#chorro)"/>
  <circle cx="224" cy="250" r="7" fill="#ff6a3d"/><circle cx="302" cy="240" r="6" fill="#ff6a3d"/><circle cx="318" cy="256" r="4" fill="#ffb08a"/><circle cx="208" cy="238" r="4" fill="#ffb08a"/>
  <!-- Botella inclinada sirviendo -->
  <g transform="rotate(125 150 118) translate(150 118) scale(1.25) translate(-150 -118)">
    <path d="M128 60 Q128 48 140 46 L160 46 Q172 48 172 60 L172 180 Q172 190 160 190 L140 190 Q128 190 128 180 Z" fill="url(#botella)"/>
    <path d="M140 46 L143 22 L157 22 L160 46 Z" fill="#c26f0a"/>
    <rect x="141" y="10" width="18" height="14" rx="3" fill="#cfd8dc"/>
    <rect x="128" y="96" width="44" height="44" fill="url(#etiqueta)"/>
    <rect x="128" y="104" width="44" height="7" fill="#ff6a3d"/>
    <path d="M164 64 L164 176" stroke="#ffe2b8" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
