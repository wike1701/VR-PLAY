<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6a2a"/>
      <stop offset="1" stop-color="#2f8a3a"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b8c0ca"/>
      <stop offset="1" stop-color="#4a525c"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5a30"/>
      <stop offset="1" stop-color="#4a2410"/>
    </linearGradient>
    <linearGradient id="camiseta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset="0.6" stop-color="#c62828"/>
      <stop offset="1" stop-color="#6a0e0e"/>
    </linearGradient>
    <linearGradient id="piel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6cfa6"/>
      <stop offset="1" stop-color="#b8845a"/>
    </linearGradient>
    <radialGradient id="cara" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe2c2"/>
      <stop offset="0.6" stop-color="#e0b088"/>
      <stop offset="1" stop-color="#9a6a42"/>
    </radialGradient>
    <radialGradient id="bola" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ecece2"/>
      <stop offset="1" stop-color="#9a9a90"/>
    </radialGradient>
    <radialGradient id="impacto">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff6a3d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05140a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#05140a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <!-- Campo con franjas y líneas -->
  <rect width="400" height="400" fill="url(#campo)"/>
  <g fill="#ffffff" opacity="0.06">
    <rect x="0" width="50" height="400"/><rect x="100" width="50" height="400"/><rect x="200" width="50" height="400"/><rect x="300" width="50" height="400"/>
  </g>
  <g fill="none" stroke="#f2f2f2" stroke-width="5" opacity="0.8">
    <path d="M30 0 L30 400"/>
    <circle cx="-40" cy="250" r="110"/>
  </g>
  <!-- Muñeco azul al fondo, en otra barra -->
  <g opacity="0.75">
    <rect x="0" y="40" width="400" height="9" fill="url(#barra)"/>
    <circle cx="95" cy="28" r="15" fill="#e0b088"/>
    <path d="M80 26 A15 15 0 0 1 110 26 Z" fill="#1a1210"/>
    <rect x="80" y="40" width="30" height="46" rx="5" fill="#1f5fd1"/>
    <rect x="82" y="86" width="26" height="16" fill="#f2f2f2"/>
    <rect x="86" y="102" width="18" height="26" fill="#d0a078"/>
    <rect x="84" y="126" width="26" height="10" rx="3" fill="#1a1a1e"/>
  </g>
  <!-- Banda de madera abajo -->
  <rect x="0" y="352" width="400" height="48" fill="url(#madera)"/>
  <rect x="0" y="352" width="400" height="5" fill="#c07a44" opacity="0.7"/>
  <!-- Barra roja y su muñeco chutando -->
  <ellipse cx="300" cy="332" rx="70" ry="12" fill="url(#sombra)"/>
  <rect x="0" y="113" width="400" height="15" fill="url(#barra)"/>
  <g transform="rotate(-35 200 120)">
    <rect x="183" y="228" width="34" height="74" fill="url(#piel)"/>
    <rect x="176" y="288" width="64" height="26" rx="7" fill="#1a1a1e"/>
    <rect x="170" y="196" width="60" height="38" rx="6" fill="#f2f2f2"/>
    <rect x="162" y="104" width="76" height="100" rx="12" fill="url(#camiseta)"/>
    <rect x="193" y="104" width="14" height="100" fill="#ffffff" opacity="0.85"/>
    <circle cx="200" cy="72" r="34" fill="url(#cara)"/>
    <path d="M166 70 A34 34 0 0 1 234 70 Q220 54 200 56 Q180 54 166 70 Z" fill="#1a1210"/>
    <rect x="200" y="82" width="26" height="6" rx="3" fill="#1a1210"/>
    <circle cx="214" cy="70" r="3.5" fill="#1a1210"/>
  </g>
  <rect x="0" y="113" width="150" height="15" fill="url(#barra)"/>
  <!-- La bola sale disparada -->
  <circle cx="338" cy="262" r="48" fill="url(#impacto)"/>
  <g fill="none" stroke="#ff6a3d" stroke-width="6" stroke-linecap="round">
    <path d="M372 226 L392 206"/><path d="M382 262 L398 262"/><path d="M370 298 L388 316"/>
  </g>
  <circle cx="340" cy="262" r="22" fill="url(#bola)"/>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
