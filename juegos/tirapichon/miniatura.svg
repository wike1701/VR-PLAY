    <radialGradient id="brillo" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#noche)"/>
  <!-- Fondo de tablas azules -->
  <rect x="20" y="70" width="360" height="300" fill="#2f5d8a"/>
  <g stroke="#244a70" stroke-width="3">
    <line x1="56" y1="70" x2="56" y2="370"/><line x1="92" y1="70" x2="92" y2="370"/><line x1="128" y1="70" x2="128" y2="370"/>
    <line x1="164" y1="70" x2="164" y2="370"/><line x1="200" y1="70" x2="200" y2="370"/><line x1="236" y1="70" x2="236" y2="370"/>
    <line x1="272" y1="70" x2="272" y2="370"/><line x1="308" y1="70" x2="308" y2="370"/><line x1="344" y1="70" x2="344" y2="370"/>
  </g>
