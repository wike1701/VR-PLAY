    <rect x="160" y="122" width="6" height="56" rx="2"/>
    <rect x="240" y="122" width="4" height="56" rx="2"/>
    <rect x="316" y="122" width="9" height="30" rx="3"/>
  </g>
  <g stroke="#eee" stroke-width="2">
