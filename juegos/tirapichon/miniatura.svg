    <rect x="160" y="20" width="40" height="50" fill="#c62828"/><rect x="240" y="20" width="40" height="50" fill="#c62828"/>
    <rect x="320" y="20" width="40" height="50" fill="#c62828"/>
    <path d="M0 70 L20 88 L40 70 L60 88 L80 70 L100 88 L120 70 L140 88 L160 70 L180 88 L200 70 L220 88 L240 70 L260 88 L280 70 L300 88 L320 70 L340 88 L360 70 L380 88 L400 70 Z" fill="#c62828"/>
