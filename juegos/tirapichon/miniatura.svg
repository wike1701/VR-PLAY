  <g>
    <circle cx="30" cy="96" r="6" fill="#ffd54f"/><circle cx="90" cy="96" r="6" fill="#ff7043"/><circle cx="150" cy="96" r="6" fill="#fff3c4"/>
    <circle cx="210" cy="96" r="6" fill="#80deea"/><circle cx="270" cy="96" r="6" fill="#ff8a80"/><circle cx="330" cy="96" r="6" fill="#ffd54f"/>
