  <g stroke="#69f0ae" stroke-width="3" fill="none">
    <circle cx="320" cy="150" r="18"/><line x1="292" y1="150" x2="304" y2="150"/><line x1="336" y1="150" x2="348" y2="150"/><line x1="320" y1="168" x2="320" y2="180"/>
