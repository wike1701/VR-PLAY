<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="espacio" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#1a2150"/>
      <stop offset="1" stop-color="#03040d"/>
    </radialGradient>
    <linearGradient id="planeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4cc2"/>
      <stop offset="0.55" stop-color="#d9825b"/>
      <stop offset="1" stop-color="#3b2a73"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#espacio)"/>
  <!-- Estrellas -->
  <g fill="#dfe8ff">
    <circle cx="40" cy="60" r="1.6"/><circle cx="120" cy="30" r="1.2"/><circle cx="210" cy="70" r="1.8"/>
    <circle cx="350" cy="40" r="1.4"/><circle cx="300" cy="120" r="1.1"/><circle cx="60" cy="170" r="1.3"/>
    <circle cx="370" cy="200" r="1.6"/><circle cx="30" cy="280" r="1.2"/><circle cx="380" cy="320" r="1.3"/>
  </g>
  <!-- Planeta -->
  <circle cx="80" cy="90" r="52" fill="url(#planeta)"/>
  <!-- Anillo dorado -->
  <ellipse cx="270" cy="150" rx="46" ry="52" fill="none" stroke="#ffc400" stroke-width="10"/>
  <!-- Asteroide -->
  <path d="M320 260 l22 -10 l18 14 l-4 24 l-24 8 l-16 -14 Z" fill="#8d7b6a"/>
  <!-- Caza enemigo explotando -->
  <circle cx="200" cy="105" r="24" fill="#ffab40" opacity="0.85"/>
  <circle cx="200" cy="105" r="12" fill="#fff59d"/>
  <!-- Láseres -->
  <g stroke="#69f0ae" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="250" x2="190" y2="125"/>
    <line x1="250" y1="250" x2="212" y2="125"/>
  </g>
  <!-- Nave (vista desde atrás) -->
  <g transform="translate(200 290)">
    <path d="M0 -48 L16 10 L0 22 L-16 10 Z" fill="#e8ecf2"/>
    <path d="M-12 0 L-92 26 L-92 34 L-10 18 Z" fill="#e8ecf2"/>
    <path d="M12 0 L92 26 L92 34 L10 18 Z" fill="#e8ecf2"/>
    <path d="M-92 26 L-80 -14 L-74 30 Z" fill="#1e88e5"/>
    <path d="M92 26 L80 -14 L74 30 Z" fill="#1e88e5"/>
    <ellipse cx="0" cy="-12" rx="7" ry="13" fill="#80deea"/>
    <circle cx="0" cy="24" r="8" fill="#4fc3f7"/>
  </g>
  <!-- Retícula -->
  <circle cx="200" cy="105" r="34" fill="none" stroke="#ff5252" stroke-width="3"/>
</svg>
