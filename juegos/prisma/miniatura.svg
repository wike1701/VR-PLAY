<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030f"/>
      <stop offset="0.6" stop-color="#1c0b3a"/>
      <stop offset="1" stop-color="#07050f"/>
    </linearGradient>
    <linearGradient id="espejo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bfe8ff"/>
      <stop offset="1" stop-color="#5a7aa8"/>
    </linearGradient>
    <linearGradient id="caraA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#46e0ff"/>
    </linearGradient>
    <linearGradient id="caraB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46e0ff"/>
      <stop offset="1" stop-color="#1a5aa8"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#9fe8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#46e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="impacto">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff6a3d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Suelo de rejilla en perspectiva -->
  <g stroke="#46e0ff" stroke-width="2" opacity="0.35">
    <path d="M0 300 L400 300"/><path d="M0 330 L400 330"/><path d="M0 368 L400 368"/>
    <path d="M200 270 L-60 400"/><path d="M200 270 L80 400"/><path d="M200 270 L200 400"/><path d="M200 270 L320 400"/><path d="M200 270 L460 400"/>
  </g>
  <g stroke="#c04aff" stroke-width="3" opacity="0.6">
    <path d="M60 0 L30 270"/><path d="M340 0 L370 270"/>
  </g>
  <!-- Rayo que entra y sale reflejado -->
  <g stroke-linecap="round">
    <path d="M0 262 L176 238" stroke="#ff6a3d" stroke-width="16" opacity="0.35"/>
    <path d="M0 262 L176 238" stroke="#fff1d6" stroke-width="5"/>
    <path d="M176 238 L292 136" stroke="#ff6a3d" stroke-width="16" opacity="0.35"/>
    <path d="M176 238 L292 136" stroke="#fff1d6" stroke-width="5"/>
  </g>
  <!-- Espejo -->
  <ellipse cx="170" cy="300" rx="62" ry="14" fill="#1a1430"/>
  <ellipse cx="170" cy="296" rx="58" ry="11" fill="none" stroke="#46e0ff" stroke-width="3"/>
  <path d="M112 180 L232 238 L232 296 L112 238 Z" fill="url(#espejo)"/>
  <path d="M112 180 L232 238 L232 296 L112 238 Z" fill="none" stroke="#7a6aff" stroke-width="7" stroke-linejoin="round"/>
  <path d="M130 196 L176 218" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <circle cx="176" cy="238" r="36" fill="url(#impacto)"/>
  <!-- Cristal encendido -->
  <circle cx="300" cy="126" r="78" fill="url(#aura)"/>
  <path d="M300 48 L344 126 L300 204 L256 126 Z" fill="url(#caraB)"/>
  <path d="M300 48 L300 204 L256 126 Z" fill="url(#caraA)"/>
  <path d="M256 126 L344 126" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <circle cx="292" cy="136" r="18" fill="url(#impacto)"/>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
