<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1424"/>
      <stop offset="0.7" stop-color="#4a1f2e"/>
      <stop offset="1" stop-color="#2a1610"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="serrin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a5c"/>
      <stop offset="1" stop-color="#7a5630"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3b37a"/>
      <stop offset="0.5" stop-color="#b9824a"/>
      <stop offset="1" stop-color="#7a4f28"/>
    </linearGradient>
    <linearGradient id="paja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77e"/>
      <stop offset="0.6" stop-color="#d9a940"/>
      <stop offset="1" stop-color="#9c7020"/>
    </linearGradient>
    <radialGradient id="guante" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e8e8ee"/>
      <stop offset="1" stop-color="#a9adbb"/>
    </radialGradient>
    <linearGradient id="cuboA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fdcff"/>
      <stop offset="1" stop-color="#1a7fc0"/>
    </linearGradient>
    <linearGradient id="cuboB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d99a10"/>
    </linearGradient>
    <linearGradient id="estela" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Lona de la carpa a rayas que sube hacia el mástil -->
  <g opacity="0.55">
    <path d="M200 -40 L-80 300 H10 Z" fill="#c62f3a"/>
    <path d="M200 -40 L60 300 H140 Z" fill="#c62f3a"/>
    <path d="M200 -40 L190 300 H270 Z" fill="#c62f3a"/>
    <path d="M200 -40 L320 300 H400 Z" fill="#c62f3a"/>
    <path d="M200 -40 L10 300 H60 Z" fill="#f3e3c3" opacity="0.5"/>
    <path d="M200 -40 L140 300 H190 Z" fill="#f3e3c3" opacity="0.5"/>
    <path d="M200 -40 L270 300 H320 Z" fill="#f3e3c3" opacity="0.5"/>
  </g>
  <!-- Bombillas -->
  <g fill="#ffe7a3"><circle cx="30" cy="246" r="4"/><circle cx="80" cy="252" r="4"/><circle cx="130" cy="256" r="4"/><circle cx="270" cy="256" r="4"/><circle cx="320" cy="252" r="4"/><circle cx="370" cy="246" r="4"/></g>
  <!-- Pista: serrín y bordillo rojo con banda dorada -->
  <rect x="0" y="290" width="400" height="110" fill="url(#serrin)"/>
  <path d="M-10 300 Q200 268 410 300 V318 Q200 286 -10 318 Z" fill="#b3202c"/>
  <path d="M-10 306 Q200 274 410 306 V311 Q200 279 -10 311 Z" fill="#f2c14e"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <ellipse cx="160" cy="372" rx="90" ry="12" fill="url(#sombra)"/>
  <!-- Estela coral del cubo que pasa rozando y del vaivén de la mano -->
  <path d="M396 150 Q340 156 300 168 L304 186 Q344 176 396 176 Z" fill="url(#estela)"/>
  <path d="M96 344 Q150 366 214 340" fill="none" stroke="#ff6a3d" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <!-- Escoba del revés, inclinada sobre la mano -->
  <g transform="rotate(24 156 330)">
    <rect x="146" y="92" width="20" height="242" rx="9" fill="url(#mango)"/>
    <rect x="151" y="96" width="4" height="232" rx="2" fill="#ffffff" opacity="0.25"/>
    <rect x="140" y="80" width="32" height="20" rx="5" fill="#c9ced6"/>
    <rect x="146" y="83" width="8" height="14" rx="3" fill="#ffffff" opacity="0.5"/>
    <path d="M140 82 Q104 50 92 -10 H220 Q208 50 172 82 Z" fill="url(#paja)"/>
    <g stroke="#8a5a14" stroke-width="3" opacity="0.5"><path d="M130 70 L112 0"/><path d="M148 72 L140 0"/><path d="M164 72 L172 0"/><path d="M182 70 L200 0"/></g>
    <path d="M118 46 Q156 38 194 46 L190 56 Q156 48 122 56 Z" fill="#b3202c"/>
  </g>
  <!-- Guante de payaso, palma arriba -->
  <ellipse cx="160" cy="342" rx="58" ry="22" fill="url(#guante)"/>
  <g fill="url(#guante)">
    <ellipse cx="104" cy="336" rx="22" ry="12"/><ellipse cx="94" cy="350" rx="20" ry="11"/><ellipse cx="100" cy="363" rx="18" ry="10"/>
    <ellipse cx="206" cy="326" rx="14" ry="22" transform="rotate(-30 206 326)"/>
  </g>
  <path d="M206 350 Q240 352 262 372 L250 392 Q230 372 200 368 Z" fill="#d32f2f"/>
  <ellipse cx="146" cy="334" rx="24" ry="6" fill="#ffffff" opacity="0.5"/>
  <!-- Cubos de colores: uno pasa rozando y otro llega -->
  <g transform="rotate(14 286 176)">
    <rect x="258" y="148" width="56" height="56" rx="10" fill="url(#cuboA)"/>
    <rect x="266" y="154" width="22" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  </g>
  <g transform="rotate(-18 336 296)">
    <rect x="314" y="274" width="44" height="44" rx="8" fill="url(#cuboB)"/>
    <rect x="320" y="279" width="18" height="8" rx="4" fill="#ffffff" opacity="0.45"/>
  </g>
  <g fill="#ffd0b8"><circle cx="250" cy="140" r="4"/><circle cx="244" cy="206" r="3.5"/></g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
