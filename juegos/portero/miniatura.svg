<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d9fd6"/>
      <stop offset="0.6" stop-color="#9fd0f0"/>
      <stop offset="0.6" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <pattern id="red" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0 L16 16 M16 0 L0 16" stroke="#fff" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Portería -->
  <rect x="40" y="90" width="320" height="170" fill="url(#red)"/>
  <path d="M40 260 V90 H360 V260" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <!-- Guantes -->
  <g transform="translate(250 150) rotate(-12)">
    <rect x="-46" y="-30" width="40" height="52" rx="12" fill="#76ff03"/>
    <rect x="6" y="-30" width="40" height="52" rx="12" fill="#76ff03"/>
    <rect x="-40" y="20" width="28" height="16" rx="4" fill="#212121"/>
    <rect x="12" y="20" width="28" height="16" rx="4" fill="#212121"/>
  </g>
  <!-- Balón -->
  <g transform="translate(196 190)">
    <circle r="30" fill="#fff" stroke="#222" stroke-width="2"/>
    <path d="M0 -12 L11 -4 L7 10 L-7 10 L-11 -4 Z" fill="#222"/>
    <path d="M0 -12 L0 -30 M11 -4 L28 -10 M7 10 L17 25 M-7 10 L-17 25 M-11 -4 L-28 -10" stroke="#222" stroke-width="2"/>
  </g>
  <!-- Líneas de movimiento del balón -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="300" x2="160" y2="236"/>
    <line x1="96" y1="286" x2="140" y2="218"/>
  </g>
  <rect x="0" y="330" width="400" height="6" fill="#fff" opacity="0.8"/>
</svg>
