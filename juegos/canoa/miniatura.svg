  <path d="M352 120 L276 336" stroke="#a77a4c" stroke-width="10" stroke-linecap="round"/>
  <rect x="336" y="108" width="34" height="9" rx="4" fill="#8a6038" transform="rotate(20 353 112)"/>
  <ellipse cx="270" cy="352" rx="16" ry="38" fill="url(#pala)" transform="rotate(20 270 352)"/>
  <g fill="#ff6a3d">
    <path d="M240 340 q-16 -30 -6 -54 q4 24 18 40 Z"/><path d="M300 330 q18 -28 10 -52 q-6 24 -20 40 Z"/>
