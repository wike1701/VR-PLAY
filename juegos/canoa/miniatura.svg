  <ellipse cx="236" cy="252" rx="26" ry="4" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="168" cy="262" rx="15" ry="9" fill="url(#roca)"/>
  <rect x="120" y="226" width="64" height="10" rx="5" fill="#6b4a2e" transform="rotate(-6 152 231)"/>
