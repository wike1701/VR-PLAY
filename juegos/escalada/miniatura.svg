<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1236"/>
      <stop offset="0.55" stop-color="#c8503a"/>
      <stop offset="1" stop-color="#ff9a4a"/>
    </linearGradient>
    <linearGradient id="roca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4a3c"/>
      <stop offset="1" stop-color="#2e1e1a"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd060"/>
      <stop offset="0.4" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#a02a08"/>
    </linearGradient>
    <linearGradient id="calor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="presa" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe0b0"/>
      <stop offset="0.5" stop-color="#c89060"/>
      <stop offset="1" stop-color="#6a4028"/>
    </radialGradient>
    <radialGradient id="guante" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#9a2a10"/>
    </radialGradient>
    <radialGradient id="sol">
      <stop offset="0" stop-color="#fff0c0"/>
      <stop offset="1" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#cielo)"/>
  <circle cx="70" cy="250" r="70" fill="url(#sol)"/>
  <!-- Agujas lejanas y río de lava -->
  <path d="M0 290 L20 180 L48 175 L60 290 Z" fill="#3a1a20"/>
  <path d="M70 300 L88 220 L110 215 L120 300 Z" fill="#4a2228"/>
  <rect x="0" y="300" width="400" height="100" fill="url(#lava)"/>
  <g fill="#7a1a04" opacity="0.6">
    <ellipse cx="60" cy="340" rx="34" ry="8"/><ellipse cx="170" cy="372" rx="44" ry="9"/><ellipse cx="300" cy="350" rx="30" ry="7"/>
  </g>
  <!-- Pared de roca -->
  <path d="M130 0 L400 0 L400 400 L170 400 Q150 300 160 200 Q150 100 130 0 Z" fill="url(#roca)"/>
  <g stroke="#1a0e0a" stroke-width="3" fill="none" opacity="0.7">
    <path d="M200 30 L220 70 L210 110"/><path d="M330 60 L310 120 L330 160"/><path d="M250 300 L280 340 L270 390"/>
  </g>
  <g stroke="#ff7a2a" stroke-width="3" fill="none" opacity="0.7">
    <path d="M360 200 L340 250 L355 300"/><path d="M210 330 L230 360"/>
  </g>
  <rect x="150" y="230" width="250" height="170" fill="url(#calor)"/>
  <!-- Presa de arriba -->
  <path d="M290 70 Q315 52 340 70 Q345 88 316 92 Q292 90 290 70 Z" fill="url(#presa)"/>
  <!-- Brazo y guante agarrando la presa -->
  <path d="M400 400 L300 250 L250 268 L330 400 Z" fill="#2a4a8a"/>
  <path d="M190 160 Q220 128 268 140 Q300 150 296 186 L292 220 Q270 258 238 254 Q200 246 196 214 Z" fill="url(#presa)"/>
  <path d="M232 228 Q240 196 276 196 Q312 204 314 238 Q312 272 280 280 Q246 282 236 258 Z" fill="url(#guante)"/>
  <g fill="url(#guante)">
    <rect x="200" y="158" width="26" height="56" rx="13" transform="rotate(-10 213 186)"/>
    <rect x="224" y="150" width="26" height="62" rx="13" transform="rotate(-4 237 181)"/>
    <rect x="250" y="150" width="26" height="62" rx="13"/>
    <rect x="274" y="158" width="24" height="54" rx="12" transform="rotate(8 286 185)"/>
  </g>
  <!-- Los dedos se meten por detrás del borde de la presa -->
  <path d="M188 172 Q214 136 266 140 Q300 146 300 176 Q270 162 240 162 Q210 164 188 172 Z" fill="#a06a42"/>
  <rect x="268" y="262" width="54" height="22" rx="6" fill="#1a2a5a" transform="rotate(-20 295 273)"/>
  <!-- Chispas -->
  <g fill="#ffd060">
    <circle cx="190" cy="300" r="4"/><circle cx="120" cy="260" r="3"/><circle cx="230" cy="320" r="3"/><circle cx="96" cy="296" r="2.5"/><circle cx="260" cy="350" r="3"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
