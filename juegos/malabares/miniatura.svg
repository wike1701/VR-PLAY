  <g fill="url(#guante)">
    <ellipse cx="72" cy="258" rx="14" ry="24" transform="rotate(-20 72 258)"/>
    <ellipse cx="92" cy="272" rx="13" ry="22" transform="rotate(-30 92 272)"/>
  </g>
  <!-- Chispas de la recepción -->
  <g fill="#ffd0b8">
    <circle cx="186" cy="196" r="5"/><circle cx="60" cy="196" r="4"/><circle cx="200" cy="232" r="3.5"/><circle cx="352" cy="64" r="4"/>
  </g>
  <g fill="#ff6a3d"><circle cx="176" cy="176" r="3.5"/><circle cx="70" cy="180" r="3"/></g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
