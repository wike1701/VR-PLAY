<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#1d2a55"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.2" stop-color="#fff0c0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tablas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6a42"/>
      <stop offset="1" stop-color="#5e3b21"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#d79a0a"/>
    </linearGradient>
    <radialGradient id="plaf">
      <stop offset="0" stop-color="#fff0e6" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff6a3d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="malla" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffc83a"/>
      <rect x="2" y="2" width="6" height="6" fill="#b3830a"/>
    </pattern>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <g fill="#ffffff" opacity="0.7"><circle cx="30" cy="30" r="1.5"/><circle cx="110" cy="56" r="1.2"/><circle cx="210" cy="24" r="1.4"/><circle cx="160" cy="110" r="1"/></g>
  <circle cx="326" cy="74" r="80" fill="url(#luna)"/>
  <circle cx="326" cy="74" r="20" fill="#fff6d6"/>
  <path d="M0 220 L40 200 L60 214 L90 196 L120 212 L170 198 L220 214 L270 196 L320 212 L360 198 L400 208 V250 H0 Z" fill="#0a1424"/>
  <!-- Barandilla y suelo del porche -->
  <rect x="0" y="250" width="400" height="150" fill="url(#tablas)"/>
  <g stroke="#3e2614" stroke-width="2" opacity="0.6"><path d="M0 290 H400 M0 336 H400 M0 380 H400"/></g>
  <rect x="0" y="226" width="400" height="10" fill="#e8e8e8"/>
  <g fill="#e8e8e8"><rect x="20" y="236" width="8" height="40"/><rect x="70" y="236" width="8" height="40"/><rect x="320" y="236" width="8" height="40"/><rect x="370" y="236" width="8" height="40"/></g>
  <!-- ¡Plaf! -->
  <circle cx="170" cy="164" r="78" fill="url(#plaf)"/>
  <g transform="translate(170 160)">
    <ellipse cx="0" cy="0" rx="16" ry="7" fill="#2a2420"/>
    <circle cx="16" cy="-2" r="6" fill="#2a2420"/>
    <path d="M20 -2 L36 2" stroke="#2a2420" stroke-width="2"/>
    <ellipse cx="-4" cy="-14" rx="18" ry="8" fill="#cfe3ff" opacity="0.8" transform="rotate(-20)"/>
    <ellipse cx="-4" cy="12" rx="18" ry="8" fill="#cfe3ff" opacity="0.8" transform="rotate(20)"/>
    <g stroke="#2a2420" stroke-width="2"><path d="M-6 4 l-10 16"/><path d="M2 5 l-2 18"/><path d="M8 4 l8 16"/></g>
  </g>
  <g fill="#ff6a3d"><path d="M110 120 l18 14 l-22 -2 z"/><path d="M230 112 l-16 16 l20 -4 z"/><path d="M106 210 l22 -10 l-8 18 z"/></g>
  <!-- Matamoscas golpeando -->
  <g transform="translate(78 34) rotate(-34 260 260)">
    <rect x="184" y="80" width="104" height="104" rx="14" fill="url(#malla)"/>
    <rect x="184" y="80" width="104" height="104" rx="14" fill="none" stroke="#d79a0a" stroke-width="6"/>
    <rect x="228" y="184" width="16" height="200" rx="6" fill="url(#mango)"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
