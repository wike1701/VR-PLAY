<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060e"/>
      <stop offset="1" stop-color="#1a1e30"/>
    </linearGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chapa" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7fb0ff"/>
      <stop offset="0.5" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#14306a"/>
    </radialGradient>
    <radialGradient id="guanteRojo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="0.5" stop-color="#c62828"/>
      <stop offset="1" stop-color="#5a0a0a"/>
    </radialGradient>
    <radialGradient id="guanteBlanco" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d8d8de"/>
      <stop offset="1" stop-color="#7a7a86"/>
    </radialGradient>
    <radialGradient id="impacto">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff6a3d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Focos y público en penumbra -->
  <path d="M90 0 L150 0 L250 330 L20 330 Z" fill="url(#haz)"/>
  <path d="M260 0 L310 0 L390 330 L170 330 Z" fill="url(#haz)"/>
  <g fill="#2a2e44">
    <circle cx="30" cy="236" r="12"/><circle cx="62" cy="230" r="12"/><circle cx="340" cy="232" r="12"/><circle cx="372" cy="238" r="12"/>
    <rect x="18" y="244" width="58" height="40"/><rect x="328" y="242" width="58" height="40"/>
  </g>
  <!-- Lona y cuerdas -->
  <path d="M0 320 L400 320 L400 400 L0 400 Z" fill="#2c5fa8"/>
  <g stroke-width="6">
    <path d="M0 250 L400 246" stroke="#c62828"/><path d="M0 280 L400 276" stroke="#f2f2f2"/><path d="M0 310 L400 306" stroke="#2a4ac8"/>
  </g>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Robot -->
  <ellipse cx="200" cy="350" rx="90" ry="12" fill="url(#sombra)"/>
  <path d="M130 360 Q120 240 160 205 L240 205 Q280 240 270 360 Z" fill="url(#chapa)"/>
  <rect x="186" y="186" width="28" height="22" fill="#22252e"/>
  <g transform="rotate(-10 200 140)">
    <ellipse cx="200" cy="140" rx="54" ry="56" fill="url(#chapa)"/>
    <rect x="152" y="122" width="96" height="26" rx="12" fill="#22252e"/>
    <rect x="168" y="130" width="24" height="9" rx="3" fill="#ffd23f"/>
    <rect x="208" y="130" width="24" height="9" rx="3" fill="#ffd23f"/>
  </g>
  <!-- Guantes del robot, bajados (abierto) -->
  <ellipse cx="118" cy="290" rx="36" ry="32" fill="url(#guanteRojo)"/>
  <ellipse cx="290" cy="300" rx="36" ry="32" fill="url(#guanteRojo)"/>
  <!-- Tu directo al mentón: estela e impacto corales -->
  <path d="M330 400 Q270 300 228 196 Q290 280 380 400 Z" fill="#ff6a3d" opacity="0.75"/>
  <circle cx="222" cy="186" r="52" fill="url(#impacto)"/>
  <g transform="rotate(-28 262 236)">
    <ellipse cx="262" cy="236" rx="46" ry="54" fill="url(#guanteBlanco)"/>
    <rect x="240" y="282" width="46" height="40" rx="8" fill="#2a4ac8"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
