  <path d="M175 285 C170 240 200 230 195 195 C215 215 220 180 232 165 C238 200 262 210 258 240 C270 230 272 260 268 285Z" fill="url(#llama)"/>
  <path d="M300 160 C298 135 315 128 312 108 C325 122 330 108 336 100 C338 122 348 135 342 160Z" fill="url(#llama)" opacity="0.85"/>
