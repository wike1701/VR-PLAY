<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="0.7" stop-color="#3a2a3a"/>
      <stop offset="1" stop-color="#2a2230"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.55" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#ffb070" stop-opacity="0.55"/>
