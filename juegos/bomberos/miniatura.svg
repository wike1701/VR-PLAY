  <rect width="400" height="400" fill="url(#fondo)"/>
  <g fill="#ffffff" opacity="0.7"><circle cx="40" cy="40" r="1.6"/><circle cx="110" cy="22" r="1.2"/><circle cx="350" cy="50" r="1.5"/><circle cx="300" cy="18" r="1.1"/></g>
  <circle cx="345" cy="70" r="16" fill="#f3efe0"/>
