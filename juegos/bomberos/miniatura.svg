  <path d="M120 360 Q170 230 212 236" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <g fill="#ffffff" opacity="0.9"><circle cx="212" cy="232" r="7"/><circle cx="226" cy="246" r="5"/><circle cx="200" cy="250" r="5"/><circle cx="232" cy="226" r="4"/></g>
