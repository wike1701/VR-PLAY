<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8dc"/>
      <stop offset="1" stop-color="#bfe2f4"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#3a0c0c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a0c0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="colina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa356"/>
      <stop offset="1" stop-color="#3f7036"/>
    </linearGradient>
    <pattern id="vichy" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="skewX(-14)">
      <rect width="44" height="44" fill="#f7efe4"/>
      <rect width="22" height="44" fill="#d94a3d" opacity="0.55"/>
      <rect width="44" height="22" fill="#d94a3d" opacity="0.55"/>
    </pattern>
    <linearGradient id="mantel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a1010" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="plato" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfc8bd"/>
    </linearGradient>
    <linearGradient id="pulpa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6f7d"/>
      <stop offset="1" stop-color="#c8243a"/>
    </linearGradient>
    <linearGradient id="plastico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#d79a0a"/>
    </linearGradient>
    <pattern id="malla" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffd04a"/>
      <rect x="2" y="2" width="6" height="6" fill="#b3830a"/>
    </pattern>
    <radialGradient id="plaf">
      <stop offset="0" stop-color="#fff0e6" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ff6a3d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Nubes y colinas -->
  <g fill="#ffffff" opacity="0.8"><ellipse cx="80" cy="66" rx="46" ry="14"/><ellipse cx="104" cy="56" rx="26" ry="14"/><ellipse cx="318" cy="44" rx="40" ry="11"/></g>
  <path d="M0 176 C60 140 120 150 170 168 C230 140 300 136 400 162 V220 H0 Z" fill="url(#colina)"/>
  <g fill="#2f5e2a"><circle cx="40" cy="160" r="22"/><circle cx="66" cy="168" r="16"/><circle cx="356" cy="150" r="24"/></g>
  <!-- Mantel de cuadros -->
  <rect x="0" y="200" width="400" height="200" fill="url(#vichy)"/>
  <rect x="0" y="200" width="400" height="200" fill="url(#mantel)"/>
  <rect width="400" height="400" fill="url(#foco)"/>
  <!-- Plato con la sandía -->
  <ellipse cx="176" cy="302" rx="120" ry="34" fill="url(#sombra)"/>
  <ellipse cx="170" cy="290" rx="112" ry="38" fill="url(#plato)"/>
  <ellipse cx="170" cy="286" rx="82" ry="25" fill="#e9e3d8"/>
  <path d="M86 284 L230 216 A104 104 0 0 1 254 288 Z" fill="#2e7d32"/>
  <path d="M96 282 L226 224 A92 92 0 0 1 244 284 Z" fill="#f1f8e9"/>
  <path d="M104 280 L222 230 A82 82 0 0 1 236 280 Z" fill="url(#pulpa)"/>
  <g fill="#1d1d1d"><ellipse cx="176" cy="264" rx="3" ry="5"/><ellipse cx="204" cy="254" rx="3" ry="5"/><ellipse cx="208" cy="272" rx="3" ry="5"/><ellipse cx="150" cy="274" rx="3" ry="5"/></g>
  <!-- ¡Plaf! sobre la mosca -->
  <circle cx="196" cy="234" r="80" fill="url(#plaf)"/>
  <g fill="#ff6a3d"><path d="M126 196 l22 10 l-24 4 z"/><path d="M262 192 l-14 18 l22 -6 z"/><path d="M128 252 l20 -8 l-6 18 z"/></g>
  <g transform="translate(190 242) rotate(-12) scale(1.5)">
    <ellipse cx="-8" cy="-10" rx="16" ry="7" fill="#d9e6f2" opacity="0.85" transform="rotate(-24)"/>
    <ellipse cx="-8" cy="10" rx="16" ry="7" fill="#d9e6f2" opacity="0.85" transform="rotate(24)"/>
    <ellipse cx="-4" cy="0" rx="14" ry="9" fill="#3a3a40"/>
    <circle cx="11" cy="0" r="7" fill="#4a4a50"/>
    <circle cx="14" cy="-5" r="4" fill="#c62828"/>
    <circle cx="14" cy="5" r="4" fill="#c62828"/>
    <ellipse cx="-8" cy="-3" rx="5" ry="2.5" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- Estela del golpe -->
  <g transform="translate(40 -46)">
  <path d="M352 64 C330 118 300 160 262 196" stroke="#ff6a3d" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M376 104 C352 150 322 186 282 214" stroke="#ff6a3d" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
  <!-- Matamoscas bajando -->
  <g transform="translate(70 -58) rotate(38 228 206)">
    <rect x="176" y="148" width="108" height="118" rx="20" fill="url(#malla)"/>
    <rect x="176" y="148" width="108" height="118" rx="20" fill="none" stroke="url(#plastico)" stroke-width="8"/>
    <rect x="222" y="34" width="16" height="118" rx="7" fill="url(#plastico)"/>
    <rect x="219" y="-26" width="22" height="66" rx="10" fill="#263238"/>
    <rect x="224" y="40" width="5" height="108" rx="2" fill="#fff6c8" opacity="0.6"/>
    <ellipse cx="200" cy="168" rx="16" ry="6" fill="#ffffff" opacity="0.35"/>
  </g>
  <rect width="400" height="400" fill="url(#vineta)"/>
</svg>
