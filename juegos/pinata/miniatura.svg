    <circle cx="215" cy="205" r="52" fill="url(#cuerpo)"/>
    <g stroke="#ffffff" stroke-width="3" opacity="0.35"><path d="M170 190 h90"/><path d="M166 210 h98"/><path d="M172 230 h86"/></g>
    <g fill="#ffd23f"><path d="M140 175 l-14 10 l6 4Z"/><path d="M290 175 l14 10 l-6 4Z"/><path d="M215 290 l-6 16 l12 0Z"/></g>
