<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0e0"/>
      <stop offset="0.65" stop-color="#ffe2b8"/>
      <stop offset="1" stop-color="#c98a5a"/>
    </linearGradient>
    <radialGradient id="foco" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cuerpo" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8fb4"/>
      <stop offset="1" stop-color="#c22f62"/>
    </radialGradient>
    <linearGradient id="pico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd6f0"/>
      <stop offset="1" stop-color="#1f8fb2"/>
    </linearGradient>
    <radialGradient id="golpe">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.62" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <rect x="0" y="250" width="400" height="80" fill="#f1e6d0"/>
  <rect x="0" y="244" width="400" height="10" fill="#b5562e"/>
