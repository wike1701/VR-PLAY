    <path d="M150 57 h24 v26 l-12 -6 l-12 6Z" fill="#2fb6d8"/><path d="M226 57 h24 v26 l-12 -6 l-12 6Z" fill="#3fbf6a"/>
    <path d="M286 50 h24 v26 l-12 -6 l-12 6Z" fill="#8a5ad6"/><path d="M346 38 h24 v26 l-12 -6 l-12 6Z" fill="#e8457a"/>
  </g>
