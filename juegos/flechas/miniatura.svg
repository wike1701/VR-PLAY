  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <g fill="#fff" opacity="0.7"><circle cx="40" cy="40" r="1.6"/><circle cx="120" cy="24" r="1.2"/><circle cx="200" cy="60" r="1.4"/><circle cx="350" cy="30" r="1.6"/><circle cx="380" cy="120" r="1.2"/></g>
  <circle cx="92" cy="92" r="90" fill="url(#luna)"/>
