  <path d="M262 190 L284 176 L292 176 L274 190 L292 204 L284 204 Z" fill="#ff7043"/>
  <path d="M282 109 L306 97 L314 98 L294 111 L310 126 L302 125 Z" fill="#ff7043"/>
