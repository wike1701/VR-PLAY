  </defs>
  <rect width="400" height="400" fill="url(#fondo)"/>
  <!-- Torre con la carga roja -->
  <rect x="300" y="150" width="70" height="200" fill="#5d4e6d"/>
  <rect x="296" y="130" width="18" height="24" fill="#5d4e6d"/>
  <rect x="326" y="130" width="18" height="24" fill="#5d4e6d"/>
  <rect x="356" y="130" width="18" height="24" fill="#5d4e6d"/>
  <circle cx="300" cy="190" r="34" fill="url(#brillo)"/>
  <!-- Jugador agachándose -->
  <circle cx="110" cy="250" r="34" fill="#ffcc80"/>
  <path d="M70 360 Q72 292 110 290 Q150 292 152 360 Z" fill="#4fc3f7"/>
  <circle cx="98" cy="246" r="5" fill="#111"/>
  <circle cx="122" cy="246" r="5" fill="#111"/>
