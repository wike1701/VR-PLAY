  <rect width="400" height="400" fill="url(#cielo)"/>
  <!-- Sol y palmera -->
  <circle cx="330" cy="70" r="30" fill="#fff59d"/>
  <path d="M60 300 Q50 200 78 120" fill="none" stroke="#8d6e4a" stroke-width="12" stroke-linecap="round"/>
  <g fill="#3f8f3a">
