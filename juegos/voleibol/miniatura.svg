<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3ea"/>
      <stop offset="0.55" stop-color="#bfe6fa"/>
      <stop offset="0.55" stop-color="#1f84c4"/>
      <stop offset="0.62" stop-color="#1f84c4"/>
      <stop offset="0.62" stop-color="#e6c890"/>
      <stop offset="1" stop-color="#d7b377"/>
