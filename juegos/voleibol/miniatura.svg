    <path d="M78 120 Q110 90 150 110 Q110 104 80 126 Z"/>
    <path d="M78 120 Q60 80 30 74 Q66 90 76 124 Z"/>
    <path d="M78 120 Q100 70 130 66 Q98 90 82 124 Z"/>
  </g>
  <!-- Red -->
  <rect x="120" y="190" width="270" height="50" fill="url(#red)"/>
  <rect x="120" y="186" width="270" height="7" fill="#1565c0"/>
  <rect x="116" y="186" width="7" height="140" fill="#eee"/>
  <!-- Balón -->
  <g transform="translate(250 120) rotate(-20)" clip-path="url(#c)">
    <rect x="-48" y="-48" width="96" height="32" fill="#ffd600"/>
    <rect x="-48" y="-16" width="96" height="32" fill="#1e63c6"/>
