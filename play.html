<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title data-i18n="jugar.tituloPagina">Jugar · VR Play</title>
  <script src="idiomas/detectar.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0f14">
  <!-- iPhone: al abrirla desde la pantalla de inicio, sin barras de Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VR Play">
  <style>
    :root {
      --bg: #0f0f14;
      --panel: rgba(26, 26, 36, 0.88);
      --text: #f2f2f7;
      --muted: #a4a4bb;
      --accent: #7c5cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* En el móvil: sin rebote al arrastrar, sin seleccionar texto ni menú al mantener el dedo */
      overscroll-behavior: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #escena canvas { display: block; touch-action: none; }

    .barra {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: linear-gradient(rgba(15, 15, 20, 0.92), rgba(15, 15, 20, 0));
    }
    .volver { color: var(--muted); text-decoration: none; font-size: 0.9rem; white-space: nowrap; }
    .volver:hover { color: var(--text); }
    .titulo { font-weight: 800; font-size: 1.1rem; margin-right: auto; }
    button {
      font: inherit; font-size: 0.9rem; font-weight: 600;
      padding: 9px 16px; border-radius: 999px; border: 1px solid #3a3a52;
      background: var(--panel); color: var(--text); cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.principal { background: var(--accent); border-color: var(--accent); }
    .corto { display: none; }
    kbd {
      font: inherit; font-size: 0.75rem; padding: 1px 6px; margin-left: 4px;
      border: 1px solid #55557a; border-radius: 4px; color: var(--muted);
    }

    .pie {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 12px 16px; text-align: center; font-size: 0.85rem; color: var(--muted);
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(rgba(15, 15, 20, 0), rgba(15, 15, 20, 0.92));
      pointer-events: none;
    }
    .pie p { margin: 4px 0; }
    #estado { color: #c9bcff; }

    .carga {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--muted); pointer-events: none;
    }
    .carga[hidden] { display: none; }

    body.en-vr .barra, body.en-vr .pie { display: none; }

    .pausa {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(8, 8, 14, 0.6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .pausa[hidden] { display: none; }
    .pausa-caja {
      display: grid; gap: 10px; width: min(340px, 100%); padding: 20px;
      border-radius: 16px; background: var(--panel); border: 1px solid var(--accent);
    }
    .pausa-sello { margin: 0; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: #b9a8ff; }
    .pausa h2 { margin: 0 0 6px; font-size: 1.3rem; }
    .pausa button { width: 100%; padding: 12px 16px; font-size: 1rem; text-align: left; border-radius: 12px; }
    .pausa button.activo-megusta { color: #ff7aa2; border-color: #ff7aa2; }
    .pausa button.activo-favorito { color: #ffd54f; border-color: #ffd54f; }

    /* Pantalla completa (o app instalada): solo el juego y dos botones flotantes */
    body.inmersivo .barra, body.inmersivo .pie { display: none; }
    .flotantes {
      position: fixed; z-index: 5; display: flex; gap: 8px;
      top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
    }
    .flotantes[hidden], body.en-vr .flotantes { display: none; }
    .flotantes button {
      width: 42px; height: 42px; padding: 0; font-size: 1.05rem; line-height: 1;
      background: rgba(15, 15, 20, 0.45); border-color: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .aviso-completa {
      position: fixed; z-index: 6; left: 16px; right: 16px; top: 64px; margin: 0 auto; max-width: 420px;
      padding: 12px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4;
      background: var(--panel); border: 1px solid var(--accent);
    }
    .aviso-completa[hidden] { display: none; }

    /* Móvil en vertical: todo en una fila y textos cortos para dejar sitio al juego */
    @media (max-width: 600px) {
      .barra { flex-wrap: nowrap; gap: 8px; padding-inline: 12px; }
      .volver .largo, .largo, kbd { display: none; }
      .corto { display: inline; }
      .volver { font-size: 1.3rem; line-height: 1; padding: 4px 2px; }
      .titulo { font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button { padding: 8px 12px; flex-shrink: 0; }
      body.sin-vr #btn-vr { display: none; }
      .pie { font-size: 0.78rem; padding-inline: 12px; }
      .pie p { margin: 2px 0; }
      #estado { display: none; }
    }
  </style>

  <!-- three.js desde la CDN de jsDelivr (versión fija) -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body class="sin-vr">
  <div id="escena"></div>

  <div class="barra">
    <a class="volver" href="index.html" data-i18n-attr="aria-label:pausa.volverCatalogo" aria-label="Volver al catálogo">←<span class="largo"> <span data-i18n="jugar.catalogo">Catálogo</span></span></a>
    <div class="titulo" id="titulo" data-i18n="comun.cargando">Cargando…</div>
    <button id="btn-completa" type="button" data-i18n-attr="title:jugar.pantallaCompleta; aria-label:jugar.pantallaCompleta" title="Pantalla completa" aria-label="Pantalla completa" hidden>⛶<span class="largo"> <span data-i18n="jugar.pantallaCompleta">Pantalla completa</span></span></button>
    <button id="btn-pausa" type="button" data-i18n-attr="title:jugar.pausaYMenu; aria-label:pausa.sello" title="Pausa y menú" aria-label="Pausa">⏸<span class="largo"> <span data-i18n="pausa.sello">Pausa</span></span> <kbd>Esc</kbd></button>
    <button id="btn-siguiente" type="button"><span class="corto" data-i18n="jugar.siguiente">Siguiente</span><span class="largo" data-i18n="jugar.siguienteJuego">Siguiente juego</span> <kbd>N</kbd></button>
    <button id="btn-vr" class="principal" type="button" data-i18n="jugar.comprobandoVR" disabled>Comprobando VR…</button>
  </div>

  <div class="pie">
    <p id="controles"></p>
    <p id="estado"></p>
  </div>

  <div class="flotantes" id="flotantes" hidden>
    <button id="flotante-pausa" type="button" data-i18n-attr="title:pausa.sello; aria-label:pausa.sello" title="Pausa" aria-label="Pausa">⏸</button>
    <button id="flotante-siguiente" type="button" data-i18n-attr="title:jugar.siguienteJuego; aria-label:jugar.siguienteJuego" title="Siguiente juego" aria-label="Siguiente juego">⏭</button>
    <button id="flotante-salir" type="button" data-i18n-attr="title:jugar.salirCompleta; aria-label:jugar.salirCompleta" title="Salir de pantalla completa" aria-label="Salir de pantalla completa">✕</button>
  </div>
  <p class="aviso-completa" id="aviso-completa" hidden></p>

  <div class="carga" id="carga" data-i18n="comun.cargando" hidden>Cargando…</div>

  <!-- Menú de pausa (ratón y móvil; en VR hay uno flotante igual) -->
  <div class="pausa" id="pausa" hidden>
    <div class="pausa-caja" role="dialog" aria-modal="true" aria-labelledby="pausa-titulo">
      <p class="pausa-sello" data-i18n="pausa.sello">Pausa</p>
      <h2 id="pausa-titulo"></h2>
      <button type="button" class="principal" data-accion="continuar">▶ <span data-i18n="pausa.continuar">Continuar</span></button>
      <button type="button" data-accion="megusta"></button>
      <button type="button" data-accion="favorito"></button>
      <button type="button" data-accion="catalogo">← <span data-i18n="pausa.volverCatalogo">Volver al catálogo</span></button>
    </div>
  </div>

  <script type="module" src="shell/shell.js"></script>
  <!-- Cloudflare Web Analytics: visitas y páginas vistas, sin cookies -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "458b790a4dac4877a454029b58b3bd49"}'></script>
  <!-- Fin de Cloudflare Web Analytics -->
</body>
</html>
