<style>
  /* Mismo portal nocturno que el catálogo: lista de hilos, hilo con respuesta anclada y formulario guiado. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.5;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .contenedor { max-width: 900px; margin-inline: auto; padding-inline: 20px; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .cabecera { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
  .logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .menu { display: flex; gap: 18px; margin-left: auto; font-size: 0.95rem; }
  .menu a { text-decoration: none; color: var(--muted); }
  .menu a:hover, .menu a[aria-current="page"] { color: var(--fg); }
  .menu { align-items: center; }
  /* Botón «Entrar» o avatar con el alias (shell/cuenta.js) */
  .boton-cuenta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .boton-cuenta { flex: none; }
  .boton-cuenta:has(.avatar) { padding: 3px 12px 3px 3px; }
  .boton-cuenta:hover { border-color: var(--accent); }
  .boton-cuenta .texto { display: inline-block; max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }
  .verificado { color: var(--accent-2); font-size: 0.85em; margin-left: 3px; text-decoration: none; }
  .enlace-perfil { text-decoration: none; }
  .enlace-perfil:hover { color: var(--accent-2); }
  .firma-cuenta { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; color: var(--muted); }
  .firma-cuenta strong { color: var(--fg); }
  .selector-idioma {
    padding: 5px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }

  h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 8px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .entradilla { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }

  .boton {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--sobre-accent);
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .boton:hover { filter: brightness(1.1); }
  .boton:disabled { opacity: 0.6; cursor: wait; }
  .boton.secundario { background: transparent; color: var(--fg); border-color: var(--line); }
  .boton.jugar { background: var(--ok); border-color: var(--ok); color: #0b2216; padding: 8px 16px; font-size: 0.9rem; }

  .portada { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-block: 36px 8px; }
  .portada > div { flex: 1 1 380px; }

  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 16px 20px; }
  .chip {
    padding: 6px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .selector {
    width: auto;
    margin-left: auto;
    padding: 6px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 0.85rem;
  }

  .lista { display: grid; gap: 12px; }
  .hilo {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .hilo h3 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 600; }
  .hilo h3 a { text-decoration: none; }
  .hilo h3 a:hover { color: var(--accent-2); }
  .extracto { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
  .detalles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 0.82rem; color: var(--muted); }

  .me-gusta {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 2px;
    min-width: 54px;
    padding: 8px 6px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .me-gusta .corazon { font-size: 1.2rem; line-height: 1; }
  .me-gusta[aria-pressed="true"] { color: var(--like); border-color: var(--like); }
  .me-gusta:disabled { cursor: wait; }
  .me-gusta.en-linea { display: inline-flex; grid-auto-flow: column; gap: 8px; padding: 8px 14px; border-radius: 12px; }

  .estado {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .estado.nueva { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 50%, transparent); }
  .estado.estudio { color: #ffd740; border-color: #8a7420; }
  .estado.desarrollo { color: #ffab40; border-color: #8a5a1c; }
  .estado.hecha { color: var(--ok); border-color: #2c7a52; }
  .estado.existe { color: #b388ff; border-color: #5b4596; }
  .estado.descartada { color: #9e9e9e; }
  .etiqueta { color: var(--accent-2); }

  .volver { display: inline-block; margin-top: 28px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .volver:hover { color: var(--fg); }
  .cabeza-hilo { padding-block: 12px 8px; }
  .cabeza-hilo .detalles { margin-bottom: 12px; }
  .texto { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .ficha {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin: 20px 0;
    padding: 0;
  }
  .ficha div { padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .ficha dt { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ficha dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }

  .anclada {
    margin: 24px 0;
    padding: 18px;
    border-radius: 14px;
    border: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  }
  .anclada .sello { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); margin: 0 0 8px; }
  .anclada .boton { margin-top: 14px; }

  .comentarios { display: grid; gap: 10px; margin: 8px 0 28px; }
  .comentario { padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .comentario.oficial { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .comentario .autor { font-weight: 600; }
  .comentario .cuando { color: var(--muted); font-size: 0.82rem; margin-left: 8px; }
  .sello-oficial {
    margin-left: 8px;
    padding: 0 7px;
    border-radius: 5px;
    background: var(--accent);
    color: var(--sobre-accent);
    font-size: 0.72rem;
    font-weight: 600;
  }
  .comentario .texto { margin-top: 4px; }

  form { display: grid; gap: 14px; }
  .formulario { padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 0.92rem; }
  label small { font-weight: 400; color: var(--muted); }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-weight: 400;
  }
  textarea { min-height: 120px; resize: vertical; }
  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .aviso { margin: 0; font-size: 0.9rem; }
  .aviso.error { color: #ff8a80; }
  .reglas {
    margin: 0 0 20px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px dashed var(--line);
    color: var(--muted);
    font-size: 0.92rem;
  }
  .reglas strong { color: var(--fg); }
  .reglas ul { margin: 6px 0 0; padding-left: 20px; }

  .vacio { color: var(--muted); padding: 24px 0; }

  footer { padding-block: 40px; color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 520px) {
    .menu { gap: 12px; }
    .boton-cuenta .texto { display: none; }
    .hilo { grid-template-columns: minmax(0, 1fr); }
    .hilo .me-gusta { justify-self: start; grid-auto-flow: column; gap: 8px; padding: 6px 12px; border-radius: 12px; }
    .selector { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="contenedor cabecera">
    <a class="logo" href="index.html">VR<span>·</span>Play</a>
    <nav class="menu" data-i18n-attr="aria-label:comun.secciones" aria-label="Secciones">
      <a href="index.html" data-i18n="comun.juegos">Juegos</a>
      <a href="foro.html" aria-current="page" data-i18n="comun.sugerencias">Sugerencias</a>
      <span data-cuenta></span>
      <span data-selector-idioma></span>
    </nav>
  </div>
</header>

<main class="contenedor" id="vista" aria-live="polite"></main>

<footer class="contenedor">
  <p>© 2026 VR Play · <span data-i18n="foro.pie">Las sugerencias son públicas: no escribas datos personales.</span> · <a href="legal.html#privacidad" data-i18n="comun.privacidad">Privacidad</a> · <a href="legal.html#aviso-legal" data-i18n="comun.avisoLegal">Aviso legal</a></p>
</footer>

<script type="module">
  import { t, existe, tOriginal, hace as haceRelativo, idioma } from './idiomas/idiomas.js';
  import { JUEGOS } from './juegos/catalogo.js';
  import { montarBotonCuenta, cuentasVisibles, avatar } from './shell/cuenta.js';

  const ESTADOS = Object.fromEntries(['nueva', 'estudio', 'desarrollo', 'hecha', 'existe', 'descartada'].map((e) => [e, t(`foro.estados.${e}`)]));
  const ORDENES = ['votos', 'recientes', 'actividad'].map((o) => [o, t(`foro.ordenes.${o}`)]);
  // Tipos de juego (géneros). En la base de datos se guarda el nombre en español,
  // así que se traducen al enseñarlos.
  const TIPOS = [...new Set([...JUEGOS.map((j) => j.generoId), 'deportes', 'disparos', 'reflejos', 'arcade', 'accion', 'puzle', 'ritmo', 'otro'])];
  const nombreTipo = (guardado) => {
    const clave = TIPOS.find((k) => tOriginal(`generos.${k}`) === guardado);
    return clave ? t(`generos.${clave}`) : guardado;
  };
  const MANOS = t('foro.manos');
  const ACCIONES = t('foro.acciones');
  // Quien no pone nombre firma como «Anónimo» y una cuenta borrada como «Usuario eliminado» (lo pone el servidor, en español)
  const firma = (autor) => (autor === 'Anónimo' ? t('foro.anonimo') : autor === 'Usuario eliminado' ? t('foro.usuarioEliminado') : autor);
  // El nombre con una marca si lo firmó alguien con la sesión iniciada (no se puede suplantar).
  // Su nombre y la marca enlazan a su perfil público.
  const perfilDe = (autor) => `perfil.html#${encodeURIComponent(autor)}`;
  const marca = (x) => (x.con_cuenta
    ? el('a', { class: 'verificado', href: perfilDe(x.autor), title: `${t('foro.conCuenta')} · ${t('foro.verPerfil', { autor: x.autor })}`, 'aria-label': t('foro.verPerfil', { autor: x.autor }) }, '✔')
    : null);
  const firmaCon = (x) => [x.con_cuenta ? el('a', { class: 'enlace-perfil', href: perfilDe(x.autor) }, firma(x.autor)) : firma(x.autor), marca(x)];

  // Sesión: con cuenta se firma con el alias; sin ella, se escribe un nombre
  const cuenta = await montarBotonCuenta() || { usuario: null, visibles: false };

  const $vista = document.getElementById('vista');
  let orden = 'votos';
  let filtroEstado = '';

  // ─── Utilidades ─────────────────────────────────────────────────────────
  // Crea un elemento: el('a', { href: '…', class: 'x' }, 'texto', otroElemento)
  function el(etiqueta, atributos = {}, ...hijos) {
    const nodo = document.createElement(etiqueta);
    for (const [clave, valor] of Object.entries(atributos)) {
      if (valor === false || valor === null || valor === undefined) continue;
      if (clave.startsWith('on')) nodo.addEventListener(clave.slice(2), valor);
      else if (clave === 'class') nodo.className = valor;
      else nodo.setAttribute(clave, valor === true ? '' : valor);
    }
    for (const hijo of hijos.flat()) {
      if (hijo === null || hijo === undefined || hijo === false) continue;
      nodo.append(hijo instanceof Node ? hijo : String(hijo));
    }
    return nodo;
  }

  // Identificador anónimo del navegador para los "me gusta"
  let votante = '';
  try {
    votante = localStorage.getItem('vrplay:votante') || '';
    if (!votante) {
      votante = crypto.randomUUID();
      localStorage.setItem('vrplay:votante', votante);
    }
  } catch {
    votante = votante || crypto.randomUUID();
  }

  async function api(ruta, opciones = {}) {
    const respuesta = await fetch(`/api${ruta}`, {
      ...opciones,
      headers: { 'content-type': 'application/json', 'x-votante': votante },
      body: opciones.datos ? JSON.stringify(opciones.datos) : undefined,
    });
    let datos = null;
    try { datos = await respuesta.json(); } catch { /* respuesta sin JSON */ }
    if (!respuesta.ok || !datos) {
      // El servidor manda un código de error para enseñarlo traducido (y el texto en español por si no lo conocemos)
      const codigo = datos?.codigo && `foro.errores.${datos.codigo}`;
      throw new Error(codigo && existe(codigo) ? t(codigo, datos) : datos?.error || t('foro.noDisponible'));
    }
    return datos;
  }

  // Fechas de SQLite en UTC ('AAAA-MM-DD HH:MM:SS') → "hace 3 horas", en el idioma de la página
  const hace = (fecha) => haceRelativo(Date.parse(fecha.replace(' ', 'T') + 'Z'));

  const juegoDe = (id) => JUEGOS.find((j) => j.id === id);
  const insigniaEstado = (estado) => el('span', { class: `estado ${estado}` }, ESTADOS[estado] || estado);

  function enlaceJuego(sugerencia) {
    if (!sugerencia.juego || !['hecha', 'existe'].includes(sugerencia.estado)) return null;
    const juego = juegoDe(sugerencia.juego);
    const nombre = juego ? juego.titulo : sugerencia.juego;
    const texto = t(sugerencia.estado === 'hecha' ? 'foro.jugarA' : 'foro.ver', { juego: nombre });
    return el('a', { class: 'boton jugar', href: `play.html#${sugerencia.juego}` }, '▶ ', texto);
  }

  function botonMeGusta(sugerencia, leGusta, enLinea = false) {
    const boton = el('button', {
      type: 'button',
      class: `me-gusta${enLinea ? ' en-linea' : ''}`,
      'aria-pressed': String(leGusta),
      'aria-label': t('pausa.meGusta'),
    });
    const pintar = (activo, total) => {
      boton.setAttribute('aria-pressed', String(activo));
      boton.replaceChildren(el('span', { class: 'corazon', 'aria-hidden': 'true' }, activo ? '♥' : '♡'), el('span', {}, total));
    };
    pintar(leGusta, sugerencia.me_gusta);
    boton.addEventListener('click', async () => {
      boton.disabled = true;
      try {
        const r = await api(`/sugerencias/${sugerencia.id}/me-gusta`, { method: 'POST', datos: { votante } });
        sugerencia.me_gusta = r.total;
        pintar(r.meGusta, r.total);
      } catch (e) {
        boton.title = e.message;
      } finally {
        boton.disabled = false;
      }
    });
    return boton;
  }

  // ─── Captcha de Cloudflare (solo si está configurado en el servidor) ───
  let config = null;
  let cargaTurnstile = null;
  async function leerConfig() {
    if (!config) {
      try { config = await api('/config'); } catch { config = { turnstile: null, activo: false }; }
    }
    return config;
  }
  async function montarCaptcha(contenedor) {
    const { turnstile } = await leerConfig();
    if (!turnstile) return { token: () => '', reiniciar() {} };
    cargaTurnstile ||= new Promise((resolver, rechazar) => {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onload = resolver;
      s.onerror = rechazar;
      document.head.append(s);
    });
    try {
      await cargaTurnstile;
      const language = { pt: 'pt-br', zh: 'zh-cn' }[idioma] || idioma;
      const widget = window.turnstile.render(contenedor, { sitekey: turnstile, theme: 'dark', language });
      return { token: () => window.turnstile.getResponse(widget) || '', reiniciar: () => window.turnstile.reset(widget) };
    } catch {
      return { token: () => '', reiniciar() {} };
    }
  }

  // ─── Lista de sugerencias ───────────────────────────────────────────────
  async function verLista() {
    document.title = t('foro.tituloPagina');
    const $lista = el('section', { class: 'lista', 'aria-label': t('comun.sugerencias') }, el('p', { class: 'vacio' }, t('foro.cargandoSugerencias')));
    const chips = ORDENES.map(([clave, nombre]) => el('button', {
      type: 'button', class: 'chip', 'aria-pressed': String(clave === orden),
      onclick: () => { orden = clave; verLista(); },
    }, nombre));
    const selector = el('select', {
      class: 'selector', 'aria-label': t('foro.filtrarEstado'),
      onchange: (e) => { filtroEstado = e.target.value; verLista(); },
    }, el('option', { value: '' }, t('foro.todosEstados')), Object.entries(ESTADOS).map(([clave, nombre]) =>
      el('option', { value: clave, selected: clave === filtroEstado }, nombre)));

    $vista.replaceChildren(
      el('section', { class: 'portada' },
        el('div', {},
          el('h1', {}, t('foro.titulo')),
          el('p', { class: 'entradilla' }, t('foro.entradilla'))),
        el('a', { class: 'boton', href: '#/nueva' }, `+ ${t('comun.sugerirJuego')}`)),
      el('div', { class: 'barra', role: 'group', 'aria-label': t('foro.ordenar') }, chips, selector),
      $lista,
    );

    try {
      const params = new URLSearchParams({ orden });
      if (filtroEstado) params.set('estado', filtroEstado);
      const { sugerencias, meGusta } = await api(`/sugerencias?${params}`);
      if (!sugerencias.length) {
        $lista.replaceChildren(el('p', { class: 'vacio' }, t(filtroEstado ? 'foro.sinEstado' : 'foro.vacio')));
        return;
      }
      const gustan = new Set(meGusta);
      $lista.replaceChildren(...sugerencias.map((s) => {
        const extracto = s.descripcion.length > 180 ? s.descripcion.slice(0, 180).trimEnd() + '…' : s.descripcion;
        return el('article', { class: 'hilo' },
          botonMeGusta(s, gustan.has(s.id)),
          el('div', {},
            el('h3', {}, el('a', { href: `#/s/${s.id}` }, s.titulo)),
            el('p', { class: 'extracto' }, extracto),
            el('div', { class: 'detalles' },
              insigniaEstado(s.estado),
              s.tipo && el('span', { class: 'etiqueta' }, `#${nombreTipo(s.tipo).toLowerCase()}`),
              el('span', {}, ...firmaCon(s), ` · ${hace(s.creada)}`),
              el('a', { href: `#/s/${s.id}` }, `💬 ${s.comentarios}`),
              enlaceJuego(s)),
          ));
      }));
    } catch (e) {
      $lista.replaceChildren(el('p', { class: 'vacio' }, e.message));
    }
  }

  // ─── Un hilo ────────────────────────────────────────────────────────────
  async function verHilo(id) {
    $vista.replaceChildren(el('a', { class: 'volver', href: '#/' }, `← ${t('foro.todas')}`), el('p', { class: 'vacio' }, t('comun.cargando')));
    let datos;
    try {
      datos = await api(`/sugerencias/${id}`);
    } catch (e) {
      $vista.replaceChildren(el('a', { class: 'volver', href: '#/' }, `← ${t('foro.todas')}`), el('p', { class: 'vacio' }, e.message));
      return;
    }
    const { sugerencia: s, comentarios, meGusta } = datos;
    document.title = `${s.titulo} · ${t('comun.sugerencias')} · VR Play`;
    const anclada = comentarios.find((c) => c.anclado);
    const resto = comentarios.filter((c) => c !== anclada);

    const ficha = [[t('foro.enLasManos'), s.manos], [t('foro.queHaces'), s.accion], [t('foro.tipo'), s.tipo && nombreTipo(s.tipo)]].filter(([, v]) => v);

    const $aviso = el('p', { class: 'aviso', role: 'status' });
    const $captcha = el('div');
    const $formulario = el('form', { class: 'formulario', novalidate: true },
      el('h2', {}, t('foro.comentar')),
      el('label', {}, t('foro.tuComentario'), el('textarea', { name: 'texto', required: true, minlength: 2, maxlength: 1500, placeholder: t('foro.comentarioEjemplo') })),
      campoNombre(),
      $captcha,
      el('div', { class: 'acciones' }, el('button', { class: 'boton', type: 'submit' }, t('foro.publicarComentario')), $aviso),
    );
    const captcha = await montarCaptcha($captcha);
    recordarNombre($formulario);
    $formulario.addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = $formulario.querySelector('button[type="submit"]');
      const texto = $formulario.texto.value.trim();
      if (texto.length < 2) return avisar($aviso, t('foro.escribeAlgo'), true);
      boton.disabled = true;
      try {
        const autor = $formulario.autor?.value || '';
        await api(`/sugerencias/${s.id}/comentarios`, { method: 'POST', datos: { texto, autor, captcha: captcha.token() } });
        guardarNombre(autor);
        verHilo(s.id);
      } catch (error) {
        avisar($aviso, error.message, true);
        captcha.reiniciar();
        boton.disabled = false;
      }
    });

    // (sin los huecos vacíos: replaceChildren escribiría «null»)
    $vista.replaceChildren(...[
      el('a', { class: 'volver', href: '#/' }, `← ${t('foro.todas')}`),
      el('article', { class: 'cabeza-hilo' },
        el('div', { class: 'detalles' }, insigniaEstado(s.estado), el('span', {}, t('foro.sugeridoPor', { autor: firma(s.autor), cuando: hace(s.creada) })), marca(s)),
        el('h1', {}, s.titulo),
        el('p', { class: 'texto' }, s.descripcion),
        ficha.length ? el('dl', { class: 'ficha' }, ficha.map(([k, v]) => el('div', {}, el('dt', {}, k), el('dd', {}, v)))) : null,
        el('div', { class: 'acciones' }, botonMeGusta(s, meGusta, true), anclada ? null : enlaceJuego(s)),
      ),
      anclada ? el('section', { class: 'anclada', 'aria-label': t('foro.respuestaAnclada') },
        el('p', { class: 'sello' }, `📌 ${anclada.oficial ? t('foro.respuestaOficial') : t('foro.respuestaDe', { autor: firma(anclada.autor) })} · ${hace(anclada.creada)}`),
        el('p', { class: 'texto' }, anclada.texto),
        enlaceJuego(s)) : null,
      el('h2', {}, t('foro.comentarios', { n: resto.length })),
      el('section', { class: 'comentarios' }, resto.length
        ? resto.map((c) => el('article', { class: `comentario${c.oficial ? ' oficial' : ''}` },
          el('div', {}, el('span', { class: 'autor' }, ...firmaCon(c)), c.oficial ? el('span', { class: 'sello-oficial' }, t('foro.oficial')) : null, el('span', { class: 'cuando' }, hace(c.creada))),
          el('p', { class: 'texto' }, c.texto)))
        : el('p', { class: 'vacio' }, t('foro.sinComentarios'))),
      $formulario,
    ].filter(Boolean));
  }

  // ─── Nueva sugerencia ───────────────────────────────────────────────────
  async function verFormulario() {
    document.title = `${t('comun.sugerirJuego')} · VR Play`;
    const lista = (id, valores) => el('datalist', { id }, valores.map((v) => el('option', { value: v })));
    const $aviso = el('p', { class: 'aviso', role: 'status' });
    const $captcha = el('div');
    const $formulario = el('form', { class: 'formulario', novalidate: true },
      el('label', {}, t('foro.nombreJuego'), el('input', { name: 'titulo', required: true, minlength: 4, maxlength: 80, placeholder: t('foro.nombreEjemplo') })),
      el('label', {}, el('span', {}, `${t('foro.deQueVa')} `, el('small', {}, t('foro.deQueVaAyuda'))),
        el('textarea', { name: 'descripcion', required: true, minlength: 20, maxlength: 2000 })),
      el('div', { class: 'fila' },
        el('label', {}, t('foro.queLlevas'), el('input', { name: 'manos', maxlength: 80, list: 'lista-manos', placeholder: t('foro.queLlevasEjemplo') })),
        el('label', {}, t('foro.queHaces'), el('input', { name: 'accion', maxlength: 80, list: 'lista-acciones', placeholder: t('foro.queHacesEjemplo') })),
        el('label', {}, t('foro.tipo'), el('select', { name: 'tipo' }, el('option', { value: '' }, t('foro.eligeUno')),
          TIPOS.map((k) => el('option', { value: tOriginal(`generos.${k}`) }, t(`generos.${k}`)))))),
      campoNombre(),
      lista('lista-manos', MANOS),
      lista('lista-acciones', ACCIONES),
      $captcha,
      el('div', { class: 'acciones' },
        el('button', { class: 'boton', type: 'submit' }, t('foro.publicarSugerencia')),
        el('a', { class: 'boton secundario', href: '#/' }, t('foro.cancelar')),
        $aviso),
    );

    $vista.replaceChildren(
      el('a', { class: 'volver', href: '#/' }, `← ${t('foro.todas')}`),
      el('section', { class: 'cabeza-hilo' },
        el('h1', {}, t('comun.sugerirJuego')),
        el('p', { class: 'entradilla' }, t('foro.antesDeEscribir'))),
      el('aside', { class: 'reglas' },
        el('strong', {}, t('foro.reglasTitulo')),
        el('ul', {}, t('foro.reglas').map((regla) => el('li', {}, regla)))),
      $formulario,
    );

    const captcha = await montarCaptcha($captcha);
    recordarNombre($formulario);
    $formulario.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = $formulario;
      const datos = {
        titulo: f.titulo.value.trim(),
        descripcion: f.descripcion.value.trim(),
        manos: f.manos.value,
        accion: f.accion.value,
        tipo: f.tipo.value,
        autor: f.autor?.value || '',
        captcha: captcha.token(),
      };
      if (datos.titulo.length < 4) return avisar($aviso, t('foro.tituloCorto'), true);
      if (datos.descripcion.length < 20) return avisar($aviso, t('foro.descripcionCorta'), true);
      const boton = f.querySelector('button[type="submit"]');
      boton.disabled = true;
      try {
        const { id } = await api('/sugerencias', { method: 'POST', datos });
        guardarNombre(datos.autor);
        location.hash = `#/s/${id}`;
      } catch (error) {
        avisar($aviso, error.message, true);
        captcha.reiniciar();
        boton.disabled = false;
      }
    });
  }

  function avisar($aviso, mensaje, esError = false) {
    $aviso.textContent = mensaje;
    $aviso.classList.toggle('error', esError);
  }

  // Con cuenta: «Publicarás como @alias». Sin ella: el campo del nombre (y una invitación a entrar).
  function campoNombre() {
    const u = cuenta.usuario;
    if (u?.alias) {
      return el('p', { class: 'firma-cuenta' }, avatar(u.alias, u.avatar, 28), el('span', {}, t('foro.publicarasComo', { alias: u.alias })));
    }
    return el('label', {}, el('span', {}, `${t('foro.tuNombre')} `, el('small', {}, t('foro.opcional')),
      cuentasVisibles(cuenta) ? el('small', {}, ' · ', el('a', { href: `entrar.html?volver=${encodeURIComponent(location.pathname + location.hash)}` }, t('foro.entraParaFirmar'))) : null),
    el('input', { name: 'autor', maxlength: 40, autocomplete: 'nickname', placeholder: t('foro.anonimo') }));
  }

  // El nombre se recuerda en este navegador para no tener que escribirlo cada vez
  function recordarNombre(formulario) {
    if (!formulario.autor) return;
    try { formulario.autor.value = localStorage.getItem('vrplay:autor') || ''; } catch { /* sin almacenamiento */ }
  }
  function guardarNombre(nombre) {
    if (cuenta.usuario?.alias) return;
    try { localStorage.setItem('vrplay:autor', nombre.trim()); } catch { /* sin almacenamiento */ }
  }

  // ─── Rutas: #/  ·  #/s/12  ·  #/nueva ───────────────────────────────────
  function ruta() {
    const hash = location.hash;
    const hilo = hash.match(/^#\/s\/(\d+)/);
    if (hilo) verHilo(Number(hilo[1]));
    else if (hash === '#/nueva') verFormulario();
    else verLista();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', ruta);
  ruta();
</script>
