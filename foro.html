<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Foro de sugerencias · VR Play</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="theme-color" content="#0f0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Mismo portal nocturno que el catálogo: lista de hilos, hilo con respuesta anclada y formulario guiado. */
  :root {
    --bg: #0e0d16;
    --surface: #1a1828;
    --surface-2: #24213a;
    --line: #34304f;
    --fg: #f1effa;
    --muted: #a19cbd;
    --accent: #8f6bff;
    --accent-2: #00e5ff;
    --like: #ff5c8a;
    --ok: #69f0ae;
    --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.5;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .contenedor { max-width: 900px; margin-inline: auto; padding-inline: 20px; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .cabecera { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
  .logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    text-decoration: none;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .menu { display: flex; gap: 18px; margin-left: auto; font-size: 0.95rem; }
  .menu a { text-decoration: none; color: var(--muted); }
  .menu a:hover, .menu a[aria-current="page"] { color: var(--fg); }

  h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 8px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .entradilla { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }

  .boton {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .boton:hover { filter: brightness(1.1); }
  .boton:disabled { opacity: 0.6; cursor: wait; }
  .boton.secundario { background: transparent; color: var(--fg); border-color: var(--line); }
  .boton.jugar { background: var(--ok); border-color: var(--ok); color: #0b2216; padding: 8px 16px; font-size: 0.9rem; }

  .portada { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-block: 36px 8px; }
  .portada > div { flex: 1 1 380px; }

  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 16px 20px; }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .selector {
    width: auto;
    margin-left: auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 0.85rem;
  }

  .lista { display: grid; gap: 12px; }
  .hilo {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .hilo h3 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 600; }
  .hilo h3 a { text-decoration: none; }
  .hilo h3 a:hover { color: var(--accent-2); }
  .extracto { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
  .detalles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 0.82rem; color: var(--muted); }

  .me-gusta {
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 2px;
    min-width: 54px;
    padding: 8px 6px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .me-gusta .corazon { font-size: 1.2rem; line-height: 1; }
  .me-gusta[aria-pressed="true"] { color: var(--like); border-color: var(--like); }
  .me-gusta:disabled { cursor: wait; }
  .me-gusta.en-linea { display: inline-flex; grid-auto-flow: column; gap: 8px; padding: 8px 14px; border-radius: 999px; }

  .estado {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 6px;
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .estado.nueva { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 50%, transparent); }
  .estado.estudio { color: #ffd740; border-color: #8a7420; }
  .estado.desarrollo { color: #ffab40; border-color: #8a5a1c; }
  .estado.hecha { color: var(--ok); border-color: #2c7a52; }
  .estado.existe { color: #b388ff; border-color: #5b4596; }
  .estado.descartada { color: #9e9e9e; }
  .etiqueta { color: var(--accent-2); }

  .volver { display: inline-block; margin-top: 28px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  .volver:hover { color: var(--fg); }
  .cabeza-hilo { padding-block: 12px 8px; }
  .cabeza-hilo .detalles { margin-bottom: 12px; }
  .texto { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .ficha {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin: 20px 0;
    padding: 0;
  }
  .ficha div { padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .ficha dt { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ficha dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }

  .anclada {
    margin: 24px 0;
    padding: 18px;
    border-radius: 14px;
    border: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  }
  .anclada .sello { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); margin: 0 0 8px; }
  .anclada .boton { margin-top: 14px; }

  .comentarios { display: grid; gap: 10px; margin: 8px 0 28px; }
  .comentario { padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .comentario.oficial { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .comentario .autor { font-weight: 600; }
  .comentario .cuando { color: var(--muted); font-size: 0.82rem; margin-left: 8px; }
  .sello-oficial {
    margin-left: 8px;
    padding: 0 7px;
    border-radius: 5px;
    background: var(--accent);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .comentario .texto { margin-top: 4px; }

  form { display: grid; gap: 14px; }
  .formulario { padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 0.92rem; }
  label small { font-weight: 400; color: var(--muted); }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-weight: 400;
  }
  textarea { min-height: 120px; resize: vertical; }
  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .aviso { margin: 0; font-size: 0.9rem; }
  .aviso.error { color: #ff8a80; }
  .reglas {
    margin: 0 0 20px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px dashed var(--line);
    color: var(--muted);
    font-size: 0.92rem;
  }
  .reglas strong { color: var(--fg); }
  .reglas ul { margin: 6px 0 0; padding-left: 20px; }

  .vacio { color: var(--muted); padding: 24px 0; }

  footer { padding-block: 40px; color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 520px) {
    .hilo { grid-template-columns: minmax(0, 1fr); }
    .hilo .me-gusta { justify-self: start; grid-auto-flow: column; gap: 8px; padding: 6px 12px; border-radius: 999px; }
    .selector { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="contenedor cabecera">
    <a class="logo" href="index.html">VR<span>·</span>Play</a>
    <nav class="menu" aria-label="Secciones">
      <a href="index.html">Juegos</a>
      <a href="foro.html" aria-current="page">Sugerencias</a>
    </nav>
  </div>
</header>

<main class="contenedor" id="vista" aria-live="polite"></main>

<footer class="contenedor">
  <p>© 2026 VR Play · Las sugerencias son públicas: no escribas datos personales.</p>
</footer>

<script type="module">
  import { JUEGOS } from './juegos/catalogo.js';

  const ESTADOS = {
    nueva: 'Nueva',
    estudio: 'En estudio',
    desarrollo: 'En desarrollo',
    hecha: 'Hecha',
    existe: 'Ya existe',
    descartada: 'Descartada',
  };
  const ORDENES = [['votos', 'Más votadas'], ['recientes', 'Recientes'], ['actividad', 'Con actividad']];
  const TIPOS = [...new Set([...JUEGOS.map((j) => j.genero), 'Deportes', 'Disparos', 'Reflejos', 'Arcade', 'Acción', 'Puzle', 'Ritmo', 'Otro'])];
  const MANOS = ['Nada (manos libres)', 'Espada', 'Martillo', 'Pistola', 'Arco', 'Bate', 'Raqueta', 'Guantes', 'Balón', 'Escudo', 'Varita', 'Pala'];
  const ACCIONES = ['Golpear', 'Lanzar', 'Disparar', 'Esquivar', 'Atrapar', 'Cortar', 'Bloquear', 'Apuntar', 'Agacharse', 'Dibujar'];

  const $vista = document.getElementById('vista');
  let orden = 'votos';
  let filtroEstado = '';

  // ─── Utilidades ─────────────────────────────────────────────────────────
  // Crea un elemento: el('a', { href: '…', class: 'x' }, 'texto', otroElemento)
  function el(etiqueta, atributos = {}, ...hijos) {
    const nodo = document.createElement(etiqueta);
    for (const [clave, valor] of Object.entries(atributos)) {
      if (valor === false || valor === null || valor === undefined) continue;
      if (clave.startsWith('on')) nodo.addEventListener(clave.slice(2), valor);
      else if (clave === 'class') nodo.className = valor;
      else nodo.setAttribute(clave, valor === true ? '' : valor);
    }
    for (const hijo of hijos.flat()) {
      if (hijo === null || hijo === undefined || hijo === false) continue;
      nodo.append(hijo instanceof Node ? hijo : String(hijo));
    }
    return nodo;
  }

  // Identificador anónimo del navegador para los "me gusta"
  let votante = '';
  try {
    votante = localStorage.getItem('vrplay:votante') || '';
    if (!votante) {
      votante = crypto.randomUUID();
      localStorage.setItem('vrplay:votante', votante);
    }
  } catch {
    votante = votante || crypto.randomUUID();
  }

  async function api(ruta, opciones = {}) {
    const respuesta = await fetch(`/api${ruta}`, {
      ...opciones,
      headers: { 'content-type': 'application/json', 'x-votante': votante },
      body: opciones.datos ? JSON.stringify(opciones.datos) : undefined,
    });
    let datos = null;
    try { datos = await respuesta.json(); } catch { /* respuesta sin JSON */ }
    if (!respuesta.ok || !datos) throw new Error(datos?.error || 'El foro no está disponible ahora mismo. Prueba más tarde.');
    return datos;
  }

  // Fechas de SQLite en UTC ('AAAA-MM-DD HH:MM:SS') → "hace 3 h"
  function hace(fecha) {
    const t = Date.parse(fecha.replace(' ', 'T') + 'Z');
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return 'ahora mismo';
    if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
    if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
    if (s < 86400 * 30) return `hace ${Math.floor(s / 86400)} d`;
    return new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  const juegoDe = (id) => JUEGOS.find((j) => j.id === id);
  const insigniaEstado = (estado) => el('span', { class: `estado ${estado}` }, ESTADOS[estado] || estado);

  function enlaceJuego(sugerencia) {
    if (!sugerencia.juego || !['hecha', 'existe'].includes(sugerencia.estado)) return null;
    const juego = juegoDe(sugerencia.juego);
    const nombre = juego ? juego.titulo : sugerencia.juego;
    const texto = sugerencia.estado === 'hecha' ? `Jugar a ${nombre}` : `Ver ${nombre}`;
    return el('a', { class: 'boton jugar', href: `play.html#${sugerencia.juego}` }, '▶ ', texto);
  }

  function botonMeGusta(sugerencia, leGusta, enLinea = false) {
    const boton = el('button', {
      type: 'button',
      class: `me-gusta${enLinea ? ' en-linea' : ''}`,
      'aria-pressed': String(leGusta),
      'aria-label': 'Me gusta',
    });
    const pintar = (activo, total) => {
      boton.setAttribute('aria-pressed', String(activo));
      boton.replaceChildren(el('span', { class: 'corazon', 'aria-hidden': 'true' }, activo ? '♥' : '♡'), el('span', {}, total));
    };
    pintar(leGusta, sugerencia.me_gusta);
    boton.addEventListener('click', async () => {
      boton.disabled = true;
      try {
        const r = await api(`/sugerencias/${sugerencia.id}/me-gusta`, { method: 'POST', datos: { votante } });
        sugerencia.me_gusta = r.total;
        pintar(r.meGusta, r.total);
      } catch (e) {
        boton.title = e.message;
      } finally {
        boton.disabled = false;
      }
    });
    return boton;
  }

  // ─── Captcha de Cloudflare (solo si está configurado en el servidor) ───
  let config = null;
  let cargaTurnstile = null;
  async function leerConfig() {
    if (!config) {
      try { config = await api('/config'); } catch { config = { turnstile: null, activo: false }; }
    }
    return config;
  }
  async function montarCaptcha(contenedor) {
    const { turnstile } = await leerConfig();
    if (!turnstile) return { token: () => '', reiniciar() {} };
    cargaTurnstile ||= new Promise((resolver, rechazar) => {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onload = resolver;
      s.onerror = rechazar;
      document.head.append(s);
    });
    try {
      await cargaTurnstile;
      const widget = window.turnstile.render(contenedor, { sitekey: turnstile, theme: 'dark', language: 'es' });
      return { token: () => window.turnstile.getResponse(widget) || '', reiniciar: () => window.turnstile.reset(widget) };
    } catch {
      return { token: () => '', reiniciar() {} };
    }
  }

  // ─── Lista de sugerencias ───────────────────────────────────────────────
  async function verLista() {
    document.title = 'Foro de sugerencias · VR Play';
    const $lista = el('section', { class: 'lista', 'aria-label': 'Sugerencias' }, el('p', { class: 'vacio' }, 'Cargando sugerencias…'));
    const chips = ORDENES.map(([clave, nombre]) => el('button', {
      type: 'button', class: 'chip', 'aria-pressed': String(clave === orden),
      onclick: () => { orden = clave; verLista(); },
    }, nombre));
    const selector = el('select', {
      class: 'selector', 'aria-label': 'Filtrar por estado',
      onchange: (e) => { filtroEstado = e.target.value; verLista(); },
    }, el('option', { value: '' }, 'Todos los estados'), Object.entries(ESTADOS).map(([clave, nombre]) =>
      el('option', { value: clave, selected: clave === filtroEstado }, nombre)));

    $vista.replaceChildren(
      el('section', { class: 'portada' },
        el('div', {},
          el('h1', {}, 'Foro de sugerencias'),
          el('p', { class: 'entradilla' }, '¿Qué juego te gustaría jugar en VR Play? Propónlo, vota los que más te gusten con ♥ y comenta. Los más votados tienen más papeletas para hacerse realidad.')),
        el('a', { class: 'boton', href: '#/nueva' }, '+ Sugerir un juego')),
      el('div', { class: 'barra', role: 'group', 'aria-label': 'Ordenar' }, chips, selector),
      $lista,
    );

    try {
      const params = new URLSearchParams({ orden });
      if (filtroEstado) params.set('estado', filtroEstado);
      const { sugerencias, meGusta } = await api(`/sugerencias?${params}`);
      if (!sugerencias.length) {
        $lista.replaceChildren(el('p', { class: 'vacio' }, filtroEstado ? 'No hay sugerencias con ese estado.' : 'Todavía no hay sugerencias. ¡Sé el primero!'));
        return;
      }
      const gustan = new Set(meGusta);
      $lista.replaceChildren(...sugerencias.map((s) => {
        const extracto = s.descripcion.length > 180 ? s.descripcion.slice(0, 180).trimEnd() + '…' : s.descripcion;
        return el('article', { class: 'hilo' },
          botonMeGusta(s, gustan.has(s.id)),
          el('div', {},
            el('h3', {}, el('a', { href: `#/s/${s.id}` }, s.titulo)),
            el('p', { class: 'extracto' }, extracto),
            el('div', { class: 'detalles' },
              insigniaEstado(s.estado),
              s.tipo && el('span', { class: 'etiqueta' }, `#${s.tipo.toLowerCase()}`),
              el('span', {}, `${s.autor} · ${hace(s.creada)}`),
              el('a', { href: `#/s/${s.id}` }, `💬 ${s.comentarios}`),
              enlaceJuego(s)),
          ));
      }));
    } catch (e) {
      $lista.replaceChildren(el('p', { class: 'vacio' }, e.message));
    }
  }

  // ─── Un hilo ────────────────────────────────────────────────────────────
  async function verHilo(id) {
    $vista.replaceChildren(el('a', { class: 'volver', href: '#/' }, '← Todas las sugerencias'), el('p', { class: 'vacio' }, 'Cargando…'));
    let datos;
    try {
      datos = await api(`/sugerencias/${id}`);
    } catch (e) {
      $vista.replaceChildren(el('a', { class: 'volver', href: '#/' }, '← Todas las sugerencias'), el('p', { class: 'vacio' }, e.message));
      return;
    }
    const { sugerencia: s, comentarios, meGusta } = datos;
    document.title = `${s.titulo} · Sugerencias · VR Play`;
    const anclada = comentarios.find((c) => c.anclado);
    const resto = comentarios.filter((c) => c !== anclada);

    const ficha = [['En las manos', s.manos], ['Qué haces', s.accion], ['Tipo de juego', s.tipo]].filter(([, v]) => v);

    const $aviso = el('p', { class: 'aviso', role: 'status' });
    const $captcha = el('div');
    const $formulario = el('form', { class: 'formulario', novalidate: true },
      el('h2', {}, 'Comentar'),
      el('label', {}, 'Tu comentario', el('textarea', { name: 'texto', required: true, minlength: 2, maxlength: 1500, placeholder: 'Ideas, variantes, qué te ha parecido el juego…' })),
      el('label', {}, el('span', {}, 'Tu nombre ', el('small', {}, '(opcional)')), el('input', { name: 'autor', maxlength: 40, autocomplete: 'nickname', placeholder: 'Anónimo' })),
      $captcha,
      el('div', { class: 'acciones' }, el('button', { class: 'boton', type: 'submit' }, 'Publicar comentario'), $aviso),
    );
    const captcha = await montarCaptcha($captcha);
    recordarNombre($formulario);
    $formulario.addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = $formulario.querySelector('button[type="submit"]');
      const texto = $formulario.texto.value.trim();
      if (texto.length < 2) return avisar($aviso, 'Escribe algo antes de publicar.', true);
      boton.disabled = true;
      try {
        await api(`/sugerencias/${s.id}/comentarios`, { method: 'POST', datos: { texto, autor: $formulario.autor.value, captcha: captcha.token() } });
        guardarNombre($formulario.autor.value);
        verHilo(s.id);
      } catch (error) {
        avisar($aviso, error.message, true);
        captcha.reiniciar();
        boton.disabled = false;
      }
    });

    $vista.replaceChildren(
      el('a', { class: 'volver', href: '#/' }, '← Todas las sugerencias'),
      el('article', { class: 'cabeza-hilo' },
        el('div', { class: 'detalles' }, insigniaEstado(s.estado), el('span', {}, `Sugerido por ${s.autor} · ${hace(s.creada)}`)),
        el('h1', {}, s.titulo),
        el('p', { class: 'texto' }, s.descripcion),
        ficha.length ? el('dl', { class: 'ficha' }, ficha.map(([k, v]) => el('div', {}, el('dt', {}, k), el('dd', {}, v)))) : null,
        el('div', { class: 'acciones' }, botonMeGusta(s, meGusta, true), anclada ? null : enlaceJuego(s)),
      ),
      anclada ? el('section', { class: 'anclada', 'aria-label': 'Respuesta anclada' },
        el('p', { class: 'sello' }, `📌 Respuesta ${anclada.oficial ? 'oficial de VR Play' : `de ${anclada.autor}`} · ${hace(anclada.creada)}`),
        el('p', { class: 'texto' }, anclada.texto),
        enlaceJuego(s)) : null,
      el('h2', {}, `Comentarios (${resto.length})`),
      el('section', { class: 'comentarios' }, resto.length
        ? resto.map((c) => el('article', { class: `comentario${c.oficial ? ' oficial' : ''}` },
          el('div', {}, el('span', { class: 'autor' }, c.autor), c.oficial ? el('span', { class: 'sello-oficial' }, 'Oficial') : null, el('span', { class: 'cuando' }, hace(c.creada))),
          el('p', { class: 'texto' }, c.texto)))
        : el('p', { class: 'vacio' }, 'Aún no hay comentarios.')),
      $formulario,
    );
  }

  // ─── Nueva sugerencia ───────────────────────────────────────────────────
  async function verFormulario() {
    document.title = 'Sugerir un juego · VR Play';
    const lista = (id, valores) => el('datalist', { id }, valores.map((v) => el('option', { value: v })));
    const $aviso = el('p', { class: 'aviso', role: 'status' });
    const $captcha = el('div');
    const $formulario = el('form', { class: 'formulario', novalidate: true },
      el('label', {}, 'Nombre del juego', el('input', { name: 'titulo', required: true, minlength: 4, maxlength: 80, placeholder: 'Por ejemplo: Tiro con Honda' })),
      el('label', {}, el('span', {}, '¿De qué va? ', el('small', {}, 'Qué tienes que hacer, cómo se consiguen puntos y cuándo se acaba la partida.')),
        el('textarea', { name: 'descripcion', required: true, minlength: 20, maxlength: 2000 })),
      el('div', { class: 'fila' },
        el('label', {}, 'Qué llevas en las manos', el('input', { name: 'manos', maxlength: 80, list: 'lista-manos', placeholder: 'Espada, raqueta, nada…' })),
        el('label', {}, 'Qué haces', el('input', { name: 'accion', maxlength: 80, list: 'lista-acciones', placeholder: 'Golpear, lanzar, esquivar…' })),
        el('label', {}, 'Tipo de juego', el('select', { name: 'tipo' }, el('option', { value: '' }, 'Elige uno'), TIPOS.map((t) => el('option', { value: t }, t))))),
      el('label', {}, el('span', {}, 'Tu nombre ', el('small', {}, '(opcional)')), el('input', { name: 'autor', maxlength: 40, autocomplete: 'nickname', placeholder: 'Anónimo' })),
      lista('lista-manos', MANOS),
      lista('lista-acciones', ACCIONES),
      $captcha,
      el('div', { class: 'acciones' },
        el('button', { class: 'boton', type: 'submit' }, 'Publicar sugerencia'),
        el('a', { class: 'boton secundario', href: '#/' }, 'Cancelar'),
        $aviso),
    );

    $vista.replaceChildren(
      el('a', { class: 'volver', href: '#/' }, '← Todas las sugerencias'),
      el('section', { class: 'cabeza-hilo' },
        el('h1', {}, 'Sugerir un juego'),
        el('p', { class: 'entradilla' }, 'Antes de escribir, mira si ya lo ha sugerido alguien: si es así, dale ♥ y comenta allí.')),
      el('aside', { class: 'reglas' },
        el('strong', {}, 'Para que encaje en VR Play'),
        el('ul', {},
          el('li', {}, 'Se juega de pie, sin desplazarte por la habitación (puedes agacharte o dar un paso).'),
          el('li', {}, 'Partidas cortas, con puntos y récord.'),
          el('li', {}, 'Un solo jugador.'),
          el('li', {}, 'También se tiene que poder jugar con el ratón, sin gafas.'))),
      $formulario,
    );

    const captcha = await montarCaptcha($captcha);
    recordarNombre($formulario);
    $formulario.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = $formulario;
      const datos = {
        titulo: f.titulo.value.trim(),
        descripcion: f.descripcion.value.trim(),
        manos: f.manos.value,
        accion: f.accion.value,
        tipo: f.tipo.value,
        autor: f.autor.value,
        captcha: captcha.token(),
      };
      if (datos.titulo.length < 4) return avisar($aviso, 'El nombre del juego necesita al menos 4 letras.', true);
      if (datos.descripcion.length < 20) return avisar($aviso, 'Cuenta un poco más de qué va (al menos 20 caracteres).', true);
      const boton = f.querySelector('button[type="submit"]');
      boton.disabled = true;
      try {
        const { id } = await api('/sugerencias', { method: 'POST', datos });
        guardarNombre(datos.autor);
        location.hash = `#/s/${id}`;
      } catch (error) {
        avisar($aviso, error.message, true);
        captcha.reiniciar();
        boton.disabled = false;
      }
    });
  }

  function avisar($aviso, mensaje, esError = false) {
    $aviso.textContent = mensaje;
    $aviso.classList.toggle('error', esError);
  }

  // El nombre se recuerda en este navegador para no tener que escribirlo cada vez
  function recordarNombre(formulario) {
    try { formulario.autor.value = localStorage.getItem('vrplay:autor') || ''; } catch { /* sin almacenamiento */ }
  }
  function guardarNombre(nombre) {
    try { localStorage.setItem('vrplay:autor', nombre.trim()); } catch { /* sin almacenamiento */ }
  }

  // ─── Rutas: #/  ·  #/s/12  ·  #/nueva ───────────────────────────────────
  function ruta() {
    const hash = location.hash;
    const hilo = hash.match(/^#\/s\/(\d+)/);
    if (hilo) verHilo(Number(hilo[1]));
    else if (hash === '#/nueva') verFormulario();
    else verLista();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', ruta);
  ruta();
</script>
